name = "gs-labs-slate-gateway"
main = "worker.js"
compatibility_date = "2024-01-01"

# Non-secret config only. Every Slate query URL (they embed a query "id" and,
# for most queries, a "h" token) lives in `wrangler secret put` instead — see
# the Secrets list in worker.js's header comment. Do NOT add id/h values here;
# this file is committed to a public repo.
[vars]
ALLOWED_ORIGIN = "https://cade-macritchie.github.io"
PORTAL_ORIGIN = "https://enroll.gs.edu"

# Create with: wrangler kv namespace create OPTIONS_CACHE
# Then paste the returned id below.
[[kv_namespaces]]
binding = "OPTIONS_CACHE"
id = "1fc9b0939692486d91f3147d3b215769"

# Portal click counts (recordAnalyticsClicks in worker.js). Created with:
# wrangler d1 create portal-analytics. Tables are created on first use.
[[d1_databases]]
binding = "PORTAL_ANALYTICS"
database_name = "portal-analytics"
database_id = "c18b4d71-7b06-439d-a4d2-73a3eb147930"

# Cohort Dashboard activity log (IT-230, "COHORT DASHBOARD ACTIVITY" in
# worker.js): the DMin application snapshot and the changes found between
# pulls. Created with: wrangler d1 create cohort-activity. Tables are
# created on first use.
[[d1_databases]]
binding = "COHORT_ACTIVITY"
database_name = "cohort-activity"
database_id = "97b42bdf-10ad-4b60-a2c2-244f08f364f7"

# "15 0 * * *": daily portal-analytics archive (archiveAnalyticsHistory in
# worker.js) folds yesterday's raw events into the permanent per-day rollup.
# "*/30 * * * *": cohort dashboard snapshot (snapshotCohortActivity). The
# scheduled handler tells them apart by event.cron, so keep these strings in
# sync with COHORT_SNAPSHOT_CRON.
[triggers]
crons = ["15 0 * * *", "*/30 * * * *"]

# Per-IP rate limiter for /api/slate/* and /api/checkin/*. Counters live in
# Cloudflare's rate-limiting service, not KV — see checkRateLimit in worker.js
# for why. namespace_id is an arbitrary account-unique integer.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# tools/checkin/ print-station relay — see "CHECK-IN PRINT QUEUE" in
# worker.js for why this is a Durable Object and not KV.
[[durable_objects.bindings]]
name = "CHECKIN_PRINT_QUEUE"
class_name = "CheckinPrintQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CheckinPrintQueue"]
