name = "gs-labs-slate-gateway"
main = "worker.js"
compatibility_date = "2024-01-01"

# Non-secret config only. Every Slate query URL (they embed a query "id" and,
# for most queries, a "h" token) lives in `wrangler secret put` instead — see
# the Secrets list in worker.js's header comment. Do NOT add id/h values here;
# this file is committed to a public repo.
[vars]
ALLOWED_ORIGIN = "https://cade-macritchie.github.io"
PORTAL_ORIGIN = "https://enroll.gs.edu"

# Create with: wrangler kv namespace create OPTIONS_CACHE
# Then paste the returned id below.
[[kv_namespaces]]
binding = "OPTIONS_CACHE"
id = "1fc9b0939692486d91f3147d3b215769"

# Per-IP rate limiter for /api/slate/* and /api/checkin/*. Counters live in
# Cloudflare's rate-limiting service, not KV — see checkRateLimit in worker.js
# for why. namespace_id is an arbitrary account-unique integer.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# tools/checkin/ print-station relay — see "CHECK-IN PRINT QUEUE" in
# worker.js for why this is a Durable Object and not KV.
[[durable_objects.bindings]]
name = "CHECKIN_PRINT_QUEUE"
class_name = "CheckinPrintQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CheckinPrintQueue"]
