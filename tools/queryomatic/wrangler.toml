name = "gs-labs-slate-gateway"
main = "worker.js"
compatibility_date = "2024-01-01"

# Non-secret config only. Every Slate query URL (they embed a query "id" and,
# for most queries, a "h" token) lives in `wrangler secret put` instead — see
# the Secrets list in worker.js's header comment. Do NOT add id/h values here;
# this file is committed to a public repo.
[vars]
ALLOWED_ORIGIN = "https://gateway-seminary-labs.github.io"
PORTAL_ORIGIN = "https://enroll.gs.edu"

# Create with: wrangler kv namespace create OPTIONS_CACHE
# Then paste the returned id below. Also used for the /api/slate/* per-IP
# rate limiter.
[[kv_namespaces]]
binding = "OPTIONS_CACHE"
id = "c6d8bdd0999b4c7b913769f3d2ce46b7"
