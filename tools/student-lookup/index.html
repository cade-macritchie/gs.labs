<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="origin">
  <title>Record Lookup</title>
  <script defer src="../../assets/portal-analytics.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    @font-face { font-family: 'Tiempos Fine'; src: url('../assets/fonts/TiemposFine-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Tiempos Fine'; src: url('../assets/fonts/TiemposFine-Semibold.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Tiempos Fine'; src: url('../assets/fonts/TiemposFine-Bold.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }
    /* GS 2026 brand refresh - see ../BRANDGUIDE.md. Colors are the guide's 7
       swatches only, plus the neutral canvas/border/muted values established by
       analytics/index.html. Type is the three-tier Tiempos Fine / Montserrat /
       Open Sans system; every corner routes through --radius (flat 4px).

       The application record deliberately keeps its "printed document" look -
       stacked sheets, a ruled margin, a rubber-stamped status. That's a
       representational device, not brand chrome, so it survives the rebrand;
       what changed is that it now draws on brand neutrals (--paper / --line)
       and a rust stamp instead of the old cream-and-amber palette. */
    :root {
      --navy: #0c0f14; --navy-mid: #2c343a; --teal: #234048; --gold: #d3a422;
      --accent3: #708aa2; --red: #c44329;
      --ink: #2c343a; --ink-soft: #5c6670; --line: #dcd8d0;
      --panel: #fff; --bg: #f4f2ee; --paper: #f4f2ee;
      --radius: 4px;
      --font-heading: 'Tiempos Fine', Georgia, serif;
      --font-subheading: Montserrat, 'Segoe UI', sans-serif;
      --font-body: 'Open Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-family: var(--font-body);
      color: var(--ink);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 552px; padding: 24px; background: var(--bg); }
    main { max-width: 860px; margin: auto; }
    .card { padding: 28px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: 0 4px 16px rgba(12,15,20,.07); }
    h1 { margin: 0 0 6px; color: var(--navy); font: 700 2rem/1.15 var(--font-heading); letter-spacing: -.015em; }
    p { margin: 0 0 20px; color: var(--ink-soft); line-height: 1.55; }
    label { display: block; margin: 0; color: var(--ink-soft); font: 700 .7rem var(--font-subheading); letter-spacing: .08em; text-transform: uppercase; }
    select, input { width: 100%; height: 42px; margin-top: 6px; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius); color: var(--ink); font: inherit; background: var(--panel); }
    input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(35,64,72,.14); }
    .search { display: grid; grid-template-columns: minmax(0,1fr) 112px; gap: 12px; margin: 20px 0; align-items: end; }
    .search-field { position: relative; }
    /* Square, flat teal - the old pill-with-a-ledge was the previous portal's
       language, not this brand's. */
    button { height: 42px; padding: 0 18px; border: 1px solid var(--teal); border-radius: var(--radius); color: #fff; background: var(--teal); cursor: pointer; font: 700 .74rem var(--font-subheading); letter-spacing: .08em; text-transform: uppercase; transition: background-color .18s ease, border-color .18s ease; }
    button:hover { background: var(--navy); border-color: var(--navy); }
    .suggestions { position: absolute; z-index: 10; top: calc(100% + 5px); right: 0; left: 0; max-height: 310px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: 0 12px 28px rgba(12,15,20,.14); }
    .suggestion { display: block; width: 100%; height: auto; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; color: var(--ink); background: var(--panel); font: inherit; letter-spacing: 0; text-transform: none; text-align: left; }
    .suggestion:last-child { border-bottom: 0; }
    .suggestion:hover, .suggestion:focus-visible { background: var(--bg); outline: none; }
    .suggestion-name { display: block; font-size: .95rem; font-weight: 600; }
    .suggestion-meta { display: block; margin-top: 4px; color: var(--ink-soft); font-size: .78rem; font-weight: 400; }
    .suggestions-message { padding: 13px 14px; color: var(--ink-soft); font-size: .85rem; text-transform: none; letter-spacing: 0; }
    /* Flat canvas fill - the guide warns off gradients between two swatches. */
    .profile { display: grid; grid-template-columns: repeat(auto-fit,minmax(230px,1fr)); gap: 14px; margin-top: 18px; padding: 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); }
    .profile-section-title { grid-column: 1/-1; display: flex; align-items: center; gap: 10px; margin-bottom: 2px; color: var(--ink-soft); font: 700 .7rem var(--font-subheading); letter-spacing: .1em; text-transform: uppercase; }
    .profile-section-title::before { content: ""; width: 28px; height: 2px; background: var(--gold); }
    .field { min-width: 0; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
    .field b { display: block; margin-top: 5px; overflow-wrap: anywhere; font-size: 1rem; }
    /* The highlighted field reads through a gold border, not a cream fill. */
    .field.feature { padding: 18px; border-color: var(--gold); background: var(--panel); }
    .field.feature b { color: var(--navy); font-size: 1.15rem; }
    .empty { padding: 28px; border: 1px solid var(--line); border-radius: var(--radius); color: var(--ink-soft); text-align: center; }
    .results { display: grid; gap: 10px; margin-top: 18px; }
    .result { width: 100%; height: auto; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); color: var(--ink); background: var(--panel); font: inherit; letter-spacing: 0; text-transform: none; text-align: left; }
    .result:hover { border-color: var(--teal); background: var(--bg); }
    .result-name { display: block; font-size: 1rem; font-weight: 600; }
    .result-meta { display: block; margin-top: 5px; color: var(--ink-soft); font-size: .85rem; font-weight: 400; }
    .profile-head { display: flex; align-items: start; justify-content: space-between; gap: 16px; }
    .profile-head h1 { margin: 0; }
    .profile-actions { display: flex; align-items: center; gap: 16px; }
    .profile-action-link { color: var(--ink-soft); font-size: .85rem; text-decoration: none; white-space: nowrap; }
    .profile-action-link:hover { color: var(--ink); text-decoration: underline; }
    body.profile-mode main { max-width: 1280px; }
    body.profile-mode .card { padding: 36px 40px; }
    body.profile-mode .profile-head { padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    body.profile-mode #summary { display: inline-flex; align-items: center; gap: 8px; margin: 14px 0 0; padding: 7px 11px; border: 1px solid var(--line); border-radius: var(--radius); color: var(--ink-soft); background: var(--bg); font: 700 .68rem var(--font-subheading); letter-spacing: .1em; line-height: 1; text-transform: uppercase; }
    body.profile-mode #summary::before { content: ""; width: 8px; height: 8px; background: var(--accent3); }
    body.profile-mode .profile { grid-template-columns: repeat(3,minmax(0,1fr)); }
    [hidden] { display: none !important; }
    .applications { max-width: 1000px; margin: 38px auto 10px; }
    .application-stack { position: relative; padding: 0 26px 28px 0; isolation: isolate; }
    .application-stack-pages { position: absolute; inset: 0; pointer-events: none; }
    /* Sheets stacked behind the top document: canvas tone, ruled margin in the
       border neutral. */
    .application-stack-sheet { position: absolute; z-index: var(--sheet-z); inset: 0 26px 28px 0; display: block; width: auto; height: auto; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(90deg,transparent 0,transparent 29px,var(--line) 30px,var(--line) 31px,transparent 32px),var(--paper); box-shadow: 0 12px 25px rgba(12,15,20,.1); transform: translate(var(--sheet-x),var(--sheet-y)) rotate(var(--sheet-angle)); transform-origin: top right; transition: transform .2s ease,box-shadow .2s ease,filter .2s ease; pointer-events: auto; cursor: pointer; }
    .application-stack-sheet::before { content: ""; position: absolute; inset: 8px; border: 1px solid var(--line); }
    .application-stack-sheet::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 48px; height: 48px; background: linear-gradient(135deg,transparent 48%,var(--line) 49% 51%,#fff 52% 70%,var(--paper) 71%); clip-path: polygon(100% 0,100% 100%,0 100%); filter: drop-shadow(-2px -2px 2px rgba(12,15,20,.15)); transform-origin: bottom right; transition: transform .2s ease,filter .2s ease; }
    .application-stack-sheet:hover, .application-stack-sheet:focus-visible { transform: translate(calc(var(--sheet-x) + 5px),calc(var(--sheet-y) + 3px)) rotate(calc(var(--sheet-angle) + .35deg)); box-shadow: 0 16px 30px rgba(12,15,20,.16); filter: brightness(1.015); outline: none; }
    .application-stack-sheet:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    .application-stack-sheet:hover::after, .application-stack-sheet:focus-visible::after { transform: rotate(-8deg) scale(1.12); filter: drop-shadow(-4px -3px 3px rgba(12,15,20,.22)); }
    .application-stack-sheet:active { transform: translate(calc(var(--sheet-x) + 7px),calc(var(--sheet-y) + 5px)) rotate(var(--sheet-angle)); box-shadow: 0 8px 18px rgba(12,15,20,.13); }
    .application-document { position: relative; z-index: 20; margin: 0; padding: 38px 42px 32px; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(90deg,transparent 0,transparent 29px,var(--line) 30px,var(--line) 31px,transparent 32px),var(--panel); box-shadow: 0 18px 45px rgba(12,15,20,.12),0 2px 5px rgba(12,15,20,.08); }
    .application-document.is-shuffling { animation: application-shuffle .36s cubic-bezier(.2,.7,.2,1); }
    @keyframes application-shuffle { 0% { transform: translate(18px,10px) rotate(.8deg); opacity: .82; } 100% { transform: none; opacity: 1; } }
    .application-document::before { content: ""; position: absolute; inset: 8px; pointer-events: none; border: 1px solid var(--line); }
    .application-document-header, .application-document-footer { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 22px; }
    .application-document-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    .international-badge { display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border: 1px solid var(--teal); border-radius: var(--radius); color: var(--teal); background: var(--panel); font: 700 .64rem var(--font-subheading); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
    .international-symbol { font-size: 1rem; line-height: 1; }
    .application-document-eyebrow { display: block; margin-bottom: 8px; color: var(--ink-soft); font: 700 .64rem var(--font-subheading); letter-spacing: .18em; text-transform: uppercase; }
    .application-document h2 { margin: 0; color: var(--navy); font: 600 clamp(1.5rem,3vw,2.1rem)/1.15 var(--font-heading); letter-spacing: -.015em; }
    /* Short rust rule under the headline - the guide's white-card treatment. */
    .application-document h2::after { content: ""; display: block; margin-top: 12px; width: 40px; height: 3px; background: var(--red); }
    /* Rubber-stamped status, restruck in rust. */
    .application-status { flex: 0 0 auto; width: auto; height: auto; max-width: 250px; padding: 10px 16px 9px; border: 3px double currentColor; border-radius: var(--radius); color: var(--red); font-family: "Courier New", Courier, monospace; font-size: .72rem; font-weight: 900; letter-spacing: .13em; line-height: 1.15; text-align: center; text-transform: uppercase; transform: rotate(-2deg); background-color: transparent; background-image: radial-gradient(circle at 13% 24%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 82% 68%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 57% 14%,#fff 0 .7px,transparent 1.2px); background-size: 17px 13px,23px 19px,29px 17px; box-shadow: inset 0 0 0 2px #fff,inset 0 0 0 3px currentColor; text-shadow: .4px 0 currentColor,-.3px .2px currentColor; cursor: default; }
    .application-status:disabled { opacity: 1; color: var(--red); }
    .application-status.is-interactive { cursor: pointer; }
    .application-status.is-interactive::after { content: "View checklist"; display: block; margin-top: 5px; font-size: .55rem; letter-spacing: .08em; }
    .application-status.is-interactive:hover { background-color: var(--bg); }
    .application-status.is-interactive:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .application-status:active { transform: rotate(-2deg) translateY(1px); box-shadow: inset 0 0 0 2px #fff,inset 0 0 0 3px currentColor; }
    .materials-toggle { position: relative; display: block; width: auto; height: auto; margin: 22px 0 0; padding: 9px 16px; border-color: var(--gold); color: var(--navy); background: var(--gold); }
    .materials-toggle:hover { border-color: var(--navy); background: var(--navy); color: #fff; }
    .application-document-rule { position: relative; height: 4px; margin: 25px 0 9px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .materials-checklist { position: relative; margin: 24px 0 4px; padding: 20px 22px; border: 1px solid var(--line); background: var(--bg); }
    .materials-checklist h3 { margin: 0 0 14px; color: var(--navy); font: 600 1.15rem var(--font-heading); }
    .materials-list { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
    .materials-item { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding-bottom: 9px; border-bottom: 1px solid var(--line); }
    .materials-item:last-child { padding-bottom: 0; border-bottom: 0; }
    .materials-name { font-family: var(--font-heading); line-height: 1.35; }
    .materials-state { flex: 0 0 auto; font: 700 .64rem var(--font-subheading); letter-spacing: .09em; text-transform: uppercase; }
    .materials-state.missing { color: var(--red); }
    .materials-state.received { color: var(--teal); }
    .materials-empty { margin: 0; color: var(--ink-soft); font-family: var(--font-heading); }
    .application-fields { position: relative; display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); margin: 0; }
    .application-field { min-width: 0; padding: 19px 20px 18px 0; border-bottom: 1px solid var(--line); }
    .application-field:nth-child(2n) { padding-right: 0; padding-left: 28px; border-left: 1px solid var(--line); }
    .application-field dt { margin: 0 0 7px; color: var(--ink-soft); font: 700 .64rem var(--font-subheading); letter-spacing: .12em; text-transform: uppercase; }
    .application-field dd { margin: 0; overflow-wrap: anywhere; font-family: var(--font-heading); font-size: 1.05rem; line-height: 1.35; }
    .application-document-footer { margin-top: 28px; color: var(--ink-soft); font-family: var(--font-heading); font-size: .82rem; }
    .application-stack-note { display: flex; align-items: center; justify-content: center; gap: 20px; min-height: 22px; margin: 8px 26px 0 0; color: var(--ink-soft); font-family: var(--font-heading); font-size: .82rem; text-align: center; }
    .application-stack-note::before { content: ""; width: 7px; height: 7px; background: var(--gold); box-shadow: 10px 0 0 var(--accent3); }
    .application-stack-status { min-height: 20px; margin: 8px 26px 0 0; color: var(--ink-soft); font-size: .75rem; text-align: center; }
    @media (prefers-reduced-motion:reduce) { .application-stack-sheet { transition: none; } .application-document.is-shuffling { animation: none; } }
    @media (max-width:800px) { body { min-height: 572px; padding: 14px; } .card { padding: 20px; } .search { grid-template-columns: 1fr; } button { width: 100%; } .materials-toggle { width: auto; } body.profile-mode .profile { grid-template-columns: repeat(2,minmax(0,1fr)); } .applications { margin-top: 30px; } .application-stack { padding-right: 18px; } .application-stack-sheet { right: 18px; } .application-document { padding: 30px 28px 26px 38px; } .application-stack-note, .application-stack-status { margin-right: 18px; } }
    @media (max-width:600px) { .profile-head { flex-direction: column; } .profile-actions { width: 100%; justify-content: space-between; } .application-document-header, .application-document-footer { align-items: flex-start; flex-direction: column; } .application-document-meta { align-items: flex-start; } .application-fields { grid-template-columns: 1fr; } .application-field, .application-field:nth-child(2n) { padding: 17px 0; border-left: 0; } }
    @media (max-width:520px) { body.profile-mode .profile { grid-template-columns: 1fr; } }
    body.search-start { display: flex; min-height: 100vh; align-items: center; }
    body.search-start main { width: 100%; min-height: 0; }
    body.search-start .card { min-height: 0; padding: 34px; }
  </style>
</head>
<body class="search-start">
  <main class="card">
    <div class="profile-head">
      <h1 id="title">Record Lookup</h1>
      <div class="profile-actions"><a id="searchAgain" class="profile-action-link" href="#" hidden>Search again</a></div>
    </div>
    <p id="summary">Search by first name, last name, or student ID.</p>
    <form id="searchForm" class="search">
      <label class="search-field">Name or student ID
        <input id="search" name="search" type="search" autocomplete="off" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false" placeholder="First name, last name, or student ID">
        <div id="suggestions" class="suggestions" role="listbox" hidden></div>
      </label>
      <button type="submit">Search</button>
    </form>
    <section id="results" class="results" hidden></section>
    <section id="profile" class="profile" hidden></section>
    <section id="applications" class="applications" aria-label="Application records" hidden>
      <div id="application-stack" class="application-stack">
        <div id="application-stack-pages" class="application-stack-pages"></div>
        <article id="application" class="application-document" aria-labelledby="application-title" tabindex="-1">
          <div class="application-document-header">
            <div><span id="application-eyebrow" class="application-document-eyebrow">Application Record</span><h2 id="application-title">Application</h2></div>
            <div class="application-document-meta">
              <span id="international-badge" class="international-badge" hidden><span class="international-symbol" aria-hidden="true">&#127760;</span> International / F-1</span>
              <button id="application-status" class="application-status" type="button" disabled>Status not provided</button>
            </div>
          </div>
          <button id="materials-toggle" class="materials-toggle" type="button" aria-controls="materials-checklist" aria-expanded="false" hidden>View materials checklist</button>
          <section id="materials-checklist" class="materials-checklist" aria-labelledby="materials-checklist-title" hidden>
            <h3 id="materials-checklist-title">Materials Checklist</h3>
            <ul id="materials-list" class="materials-list"></ul>
            <p id="materials-empty" class="materials-empty" hidden>No checklist items were provided.</p>
          </section>
          <div class="application-document-rule"></div>
          <dl id="application-fields" class="application-fields"></dl>
          <div class="application-document-footer">
            <span>Gateway Seminary Admissions</span>
          </div>
        </article>
      </div>
      <p id="application-stack-note" class="application-stack-note" hidden></p>
      <p id="application-stack-status" class="application-stack-status" role="status" aria-live="polite" hidden></p>
    </section>
    <div id="empty" class="empty">Enter a first name, last name, or student ID to begin.</div>
  </main>
  <script>
    const results = document.getElementById('results');
    const title = document.getElementById('title');
    const searchAgain = document.getElementById('searchAgain');
    const app = document.querySelector('main');
    const profile = document.getElementById('profile');
    const applications = document.getElementById('applications');
    const applicationStackPages = document.getElementById('application-stack-pages');
    const application = document.getElementById('application');
    const applicationEyebrow = document.getElementById('application-eyebrow');
    const applicationTitle = document.getElementById('application-title');
    const applicationStatus = document.getElementById('application-status');
    const internationalBadge = document.getElementById('international-badge');
    const materialsToggle = document.getElementById('materials-toggle');
    const materialsChecklist = document.getElementById('materials-checklist');
    const materialsList = document.getElementById('materials-list');
    const materialsEmpty = document.getElementById('materials-empty');
    const applicationFields = document.getElementById('application-fields');
    const applicationStackNote = document.getElementById('application-stack-note');
    const applicationStackStatus = document.getElementById('application-stack-status');
    const empty = document.getElementById('empty');
    const summary = document.getElementById('summary');
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('search');
    const suggestions = document.getElementById('suggestions');
    const allowedOrigin = 'https://enroll.gs.edu';
    let suggestionTimer = 0;
    let suggestionRequest = 0;
    let applicationRequest = 0;
    let applicationRecords = [];
    let currentProfile = null;

    function resize() { window.parent.postMessage({ type:'student-lookup-resize', height:Math.ceil(document.body.getBoundingClientRect().height) }, '*'); }
    function decodeEntities(value) {
      const named = { amp:'&', apos:"'", quot:'"', lt:'<', gt:'>', nbsp:'\u00a0', rsquo:'’', lsquo:'‘', rdquo:'”', ldquo:'“', ndash:'–', mdash:'—' };
      let decoded = String(value == null ? '' : value);
      for (let pass = 0; pass < 3; pass += 1) {
        const next = decoded.replace(/&#x([0-9a-f]+);/gi, (match, digits) => { const code = parseInt(digits, 16); return Number.isInteger(code) && code <= 0x10ffff ? String.fromCodePoint(code) : match; }).replace(/&#(\d+);/g, (match, digits) => { const code = parseInt(digits, 10); return Number.isInteger(code) && code <= 0x10ffff ? String.fromCodePoint(code) : match; }).replace(/&([a-z]+);/gi, (match, name) => Object.prototype.hasOwnProperty.call(named, name.toLowerCase()) ? named[name.toLowerCase()] : match);
        if (next === decoded) break;
        decoded = next;
      }
      return decoded;
    }
    function value(rawValue) { return decodeEntities(rawValue).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim(); }
    function text(rawValue) { const normalized = value(rawValue); return normalized === '' ? '—' : normalized; }
    function list(rawValue) {
      const seen = new Set();
      const source = decodeEntities(rawValue).replace(/<br\s*\/?\s*>/gi, '\n').replace(/<\/(?:li|p|div|tr)>/gi, '\n').replace(/<[^>]*>/g, ' ');
      const items = [];
      let item = '';
      let parenthesisDepth = 0;
      function finishItem() { const normalized=item.replace(/\s+/g, ' ').trim(); if (normalized) items.push(normalized); item=''; }
      for (const character of source) {
        if (character === '(') parenthesisDepth += 1;
        if (character === ')' && parenthesisDepth > 0) parenthesisDepth -= 1;
        if ((character === '\n' || character === '\r' || character === ',' || character === ';' || character === '|') && parenthesisDepth === 0) finishItem();
        else item += /\s/.test(character) ? ' ' : character;
      }
      finishItem();
      return items.filter(item => { const key=item.toLowerCase(); if (seen.has(key)) return false; seen.add(key); return true; });
    }
    function renderMaterialsChecklist(record) {
      const allItems = list(record.full_mats_list);
      const missingItems = list(record.missing_mats_list);
      const missingKeys = new Set(missingItems.map(item => item.toLowerCase()));
      missingItems.forEach(item => { if (!allItems.some(existing => existing.toLowerCase() === item.toLowerCase())) allItems.push(item); });
      materialsList.replaceChildren();
      allItems.forEach(item => { const row=document.createElement('li'); row.className='materials-item'; const name=document.createElement('span'); name.className='materials-name'; name.textContent=item; const state=document.createElement('span'); const isMissing=missingKeys.has(item.toLowerCase()); state.className='materials-state ' + (isMissing ? 'missing' : 'received'); state.textContent=isMissing ? 'Missing' : 'Received'; row.append(name,state); materialsList.appendChild(row); });
      materialsEmpty.hidden = allItems.length > 0;
      return allItems.length;
    }
    function showResultsLayout() { document.body.classList.remove('search-start'); }
    function hideSuggestions() { suggestions.hidden=true; suggestions.replaceChildren(); searchInput.setAttribute('aria-expanded','false'); }
    function renderSuggestions(candidates) {
      suggestions.replaceChildren();
      if (!candidates.length) { const message=document.createElement('div'); message.className='suggestions-message'; message.textContent='No suggested records found.'; suggestions.appendChild(message); }
      candidates.forEach(person => { const button=document.createElement('button'); button.className='suggestion'; button.type='button'; button.setAttribute('role','option'); button.innerHTML='<span class="suggestion-name"></span><span class="suggestion-meta"></span>'; button.querySelector('.suggestion-name').textContent=text(person.name); button.querySelector('.suggestion-meta').textContent=[person.SIS_ID,person.email,person.program].filter(Boolean).map(decodeEntities).join(' · '); button.addEventListener('click', () => { searchInput.value=value(person.name) || value(person.SIS_ID); hideSuggestions(); renderProfile(person); requestAnimationFrame(resize); }); suggestions.appendChild(button); });
      suggestions.hidden=false; searchInput.setAttribute('aria-expanded','true'); requestAnimationFrame(resize);
    }
    function hasApplication(record) {
      const applicationKeys = ['app_degree','app_round','app_status','app_created_date','decision_code','app_term','app_year','app_f1','missing_mats_list','full_mats_list'];
      return Boolean(record) && (applicationKeys.some(key => value(record[key])) || value(record.app_url));
    }
    function applicationIdentity(record) {
      return ['app_degree','app_round','app_status','app_created_date','decision_code','app_term','app_year'].map(key => value(record[key]).toLowerCase()).join('|');
    }
    function isStudentRecord(record) { return value(record && record.status).toLowerCase() === 'student'; }
    function isAffirmative(rawValue) { return ['1','true','yes','y'].includes(value(rawValue).toLowerCase()); }
    function renderApplication(record) {
      const fields = [['Degree / Program','app_degree'],['Application Round','app_round'],['Application Status','app_status'],['Application Created','app_created_date'],['Decision Code','decision_code'],['Term','app_term'],['Year','app_year']];
      applicationEyebrow.textContent = applicationRecords.length > 1 ? `Application Record · 1 of ${applicationRecords.length}` : 'Application Record';
      applicationTitle.textContent = value(record.app_degree) || 'Application';
      const applicationStatusValue = value(record.app_status);
      internationalBadge.hidden = !isAffirmative(record.app_f1);
      applicationStatus.textContent = applicationStatusValue || 'Status not provided';
      materialsChecklist.hidden = true;
      const materialsCount = renderMaterialsChecklist(record);
      const hasMaterialsChecklist = materialsCount > 0 || applicationStatusValue.toLowerCase().includes('awaiting material');
      materialsToggle.hidden = !hasMaterialsChecklist;
      materialsToggle.textContent = materialsCount > 0 ? `View materials checklist (${materialsCount})` : 'View materials checklist';
      materialsToggle.setAttribute('aria-expanded', 'false');
      applicationFields.replaceChildren();
      fields.forEach(([label,key]) => { const field=document.createElement('div'); field.className='application-field'; const term=document.createElement('dt'); const description=document.createElement('dd'); term.textContent=label; description.textContent=text(record[key]); field.append(term,description); applicationFields.appendChild(field); });
    }
    function renderApplicationStack() {
      applications.hidden = applicationRecords.length === 0;
      applicationStackPages.replaceChildren();
      applicationStackNote.hidden = applicationRecords.length < 2;
      if (!applicationRecords.length) return;
      renderApplication(applicationRecords[0]);
      if (applicationRecords.length > 1) applicationStackNote.textContent = `${applicationRecords.length} application records — select an exposed page corner to bring it to the top.`;
      applicationRecords.slice(1).forEach((record,index) => {
        const sheet=document.createElement('button');
        const depth=index + 1;
        sheet.className='application-stack-sheet';
        sheet.type='button';
        sheet.style.setProperty('--sheet-z', String(15 - depth));
        sheet.style.setProperty('--sheet-x', `${Math.min(depth,4) * 6 + 4}px`);
        sheet.style.setProperty('--sheet-y', `${Math.min(depth,4) * 7 + 3}px`);
        sheet.style.setProperty('--sheet-angle', `${depth % 2 ? .32 : -.22}deg`);
        sheet.setAttribute('aria-label', `Bring application for ${value(record.app_degree) || 'another program'} to the top`);
        sheet.title=value(record.app_degree) || 'View application';
        sheet.addEventListener('click', () => {
          const selected=applicationRecords.splice(index + 1,1)[0];
          applicationRecords.unshift(selected);
          application.classList.remove('is-shuffling');
          renderApplicationStack();
          void application.offsetWidth;
          application.classList.add('is-shuffling');
          application.focus({ preventScroll:true });
          requestAnimationFrame(resize);
        });
        applicationStackPages.appendChild(sheet);
      });
    }
    function setApplicationRecords(primaryRecord, additionalRecords) {
      const records=[];
      const seen=new Set();
      const primaryDegree=value(primaryRecord && primaryRecord.app_degree).toLowerCase();
      const embedded=Array.isArray(primaryRecord && primaryRecord.embedded_applications) ? primaryRecord.embedded_applications : [];
      if (embedded.length > 1) {
        // Applications Slate exported together in the person's own row: keep every one, even same-program repeats.
        embedded.forEach(record => { const identity=applicationIdentity(record); if (!hasApplication(record) || seen.has(identity)) return; seen.add(identity); records.push(record); });
      } else if (hasApplication(primaryRecord)) { records.push(primaryRecord); seen.add(applicationIdentity(primaryRecord)); }
      (Array.isArray(additionalRecords) ? additionalRecords : []).forEach(record => {
        const degree=value(record && record.app_degree);
        const identity=applicationIdentity(record || {});
        if (!hasApplication(record) || !degree || (primaryDegree && degree.toLowerCase() === primaryDegree) || seen.has(identity)) return;
        seen.add(identity);
        records.push(record);
      });
      applicationRecords=records;
      renderApplicationStack();
    }
    function requestAdditionalApplications(record) {
      applicationRequest += 1;
      const requestId=applicationRequest;
      const studentId=value(record && record.SIS_ID);
      applicationStackStatus.hidden=true;
      applicationStackStatus.textContent='';
      if (!isStudentRecord(record) || !studentId) return;
      applicationStackStatus.hidden=false;
      applicationStackStatus.textContent='Looking for additional applications…';
      window.parent.postMessage({ type:'student-lookup-applications-request', requestId, studentId, recordStatus:value(record.status) }, '*');
    }
    function renderProfile(record) {
      profile.innerHTML = '';
      if (!record) return;
      currentProfile=record;
      const profileHeading=document.createElement('div'); profileHeading.className='profile-section-title'; profileHeading.textContent='Person Profile'; profile.appendChild(profileHeading);
      const fields = [['SIS ID','SIS_ID'],['Program','program'],['Status','status'],['Teaching Site','teachingsite'],['Pipeline','pipeline'],['Location Code','location_code'],['Email','email'],['Phone','phone'],['Birthdate','birthdate']];
      fields.forEach(([label,key]) => { const el=document.createElement('div'); el.className='field' + (['program','status','teachingsite'].includes(key) ? ' feature' : ''); el.innerHTML=`<label>${label}</label><b></b>`; el.querySelector('b').textContent=text(record[key]); profile.appendChild(el); });
      setApplicationRecords(record, []);
      requestAdditionalApplications(record);
      const status = value(record.status);
      showResultsLayout(); document.body.classList.add('profile-mode'); app.classList.add('profile-mode'); profile.hidden=false; empty.hidden=true; results.hidden=true; searchForm.hidden=true; searchAgain.hidden=false; title.textContent=value(record.name) || 'Record Profile'; summary.textContent=status || 'Status not provided';
      window.scrollTo(0, 0);
      window.parent.postMessage({ type:'student-lookup-scroll-top' }, '*');
    }
    function renderResults(candidates) {
      applicationRequest += 1; currentProfile=null; applicationRecords=[]; applicationStackStatus.hidden=true;
      showResultsLayout(); document.body.classList.remove('profile-mode'); app.classList.remove('profile-mode'); results.innerHTML=''; results.hidden=false; empty.hidden=true; profile.hidden=true; applications.hidden=true;
      candidates.forEach(person => { const button=document.createElement('button'); button.className='result'; button.type='button'; button.innerHTML='<span class="result-name"></span><span class="result-meta"></span>'; button.querySelector('.result-name').textContent=text(person.name); button.querySelector('.result-meta').textContent=[person.email, person.program, person.status, person.term, person.vear].filter(Boolean).map(decodeEntities).join(' · '); button.addEventListener('click', () => { renderProfile(person); requestAnimationFrame(resize); }); results.appendChild(button); });
      summary.textContent=`${candidates.length} matching records — select one to view the profile.`;
    }
    window.addEventListener('message', (event) => {
      if (event.origin !== allowedOrigin || !event.data) return;
      if (event.data.type === 'student-lookup-suggestions') {
        if (Number(event.data.requestId) !== suggestionRequest) return;
        renderSuggestions(Array.isArray(event.data.candidates) ? event.data.candidates : []);
        return;
      }
      if (event.data.type === 'student-lookup-applications') {
        if (Number(event.data.requestId) !== applicationRequest || !currentProfile || value(event.data.studentId) !== value(currentProfile.SIS_ID)) return;
        applicationStackStatus.hidden=true;
        applicationStackStatus.textContent='';
        if (event.data.error) {
          applicationStackStatus.hidden=false;
          applicationStackStatus.textContent='Additional applications could not be loaded.';
        } else setApplicationRecords(currentProfile, Array.isArray(event.data.applications) ? event.data.applications : []);
        requestAnimationFrame(resize);
        return;
      }
      if (event.data.type !== 'student-lookup-data') return;
      const data = event.data.payload || {}; const candidates = Array.isArray(data.candidates) ? data.candidates : [];
      searchInput.value = data.query && data.query.search || '';
      if (data.loadError) { showResultsLayout(); results.hidden=true; profile.hidden=true; applications.hidden=true; empty.hidden=false; empty.textContent=data.loadError; summary.textContent='Record Lookup unavailable'; requestAnimationFrame(resize); return; }
      if (data.searched && Number(data.resultCount || candidates.length) > 100) { showResultsLayout(); results.hidden=true; profile.hidden=true; applications.hidden=true; empty.hidden=false; empty.textContent='More than 100 records matched. Add another search value to narrow the results.'; summary.textContent='Refine your search'; requestAnimationFrame(resize); return; }
      if (data.profile || candidates.length === 1) renderProfile(data.profile || candidates[0]);
      else if (candidates.length > 1) renderResults(candidates);
      else if (candidates.length) { empty.hidden=false; empty.textContent='Loading the record profile…'; summary.textContent='Record Lookup'; }
      else if (data.searched) { showResultsLayout(); applications.hidden=true; empty.hidden=false; empty.textContent='No records matched that search.'; summary.textContent='Record Lookup'; }
      requestAnimationFrame(resize);
    });
    searchForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const search = searchInput.value.trim();
      if (!search) return;
      hideSuggestions();
      window.parent.postMessage({ type:'student-lookup-search', values:{ search } }, '*');
    });
    searchInput.addEventListener('input', () => {
      clearTimeout(suggestionTimer);
      const search=searchInput.value.trim();
      suggestionRequest += 1;
      if (search.length < 2) { hideSuggestions(); return; }
      const requestId=suggestionRequest;
      suggestions.innerHTML='<div class="suggestions-message">Finding records…</div>'; suggestions.hidden=false; searchInput.setAttribute('aria-expanded','true');
      suggestionTimer=setTimeout(() => { window.parent.postMessage({ type:'student-lookup-suggest', search, requestId }, '*'); }, 250);
    });
    searchInput.addEventListener('keydown', (event) => { if (event.key === 'Escape') hideSuggestions(); });
    document.addEventListener('click', (event) => { if (!searchForm.contains(event.target)) hideSuggestions(); });
    searchAgain.addEventListener('click', (event) => { event.preventDefault(); window.parent.postMessage({ type:'student-lookup-search', values:{} }, '*'); });
    materialsToggle.addEventListener('click', () => { const expanded=materialsToggle.getAttribute('aria-expanded') === 'true'; materialsToggle.setAttribute('aria-expanded', String(!expanded)); materialsToggle.textContent=expanded ? `View materials checklist${materialsList.children.length ? ` (${materialsList.children.length})` : ''}` : 'Hide materials checklist'; materialsChecklist.hidden=expanded; requestAnimationFrame(resize); });
    window.addEventListener('load', () => { resize(); setTimeout(resize, 300); }); new ResizeObserver(resize).observe(document.documentElement);
  </script>
</body>
</html>
