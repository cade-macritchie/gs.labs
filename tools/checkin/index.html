<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="referrer" content="origin">
  <title>Check-In</title>
  <script defer src="../../assets/portal-analytics.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Pinned to 1.5.1: 1.5.4 (and later) no longer ships build/qrcode.min.js,
       so that URL 404s and window.QRCode is silently undefined. -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <!-- jsQR decodes camera frames when the browser has no native BarcodeDetector
       (Safari/iOS as of this writing) — see startCameraScan() in the script
       below, which tries BarcodeDetector first and falls back to this. -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <!-- DYMO Connect Framework SDK, self-hosted — see tools/checkin/README.md.
       Not on any public CDN; download it from DYMO's own SDK and drop it in
       vendor/. Loading it with a plain <script> (no `defer`) means it's
       parsed before our own script below runs, but the file itself is
       optional at runtime — see dymoAvailable() in the script. A missing
       file 404s quietly in the console and the page still works, just
       without the "Print to Dymo" path. -->
  <script src="vendor/dymo.connect.framework.js" onerror="window.__dymoLoadFailed = true;"></script>
  <style>
    @font-face { font-family: 'Tiempos Fine'; src: url('../assets/fonts/TiemposFine-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Tiempos Fine'; src: url('../assets/fonts/TiemposFine-Semibold.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Tiempos Fine'; src: url('../assets/fonts/TiemposFine-Bold.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }
    /* GS 2026 brand refresh - see ../../BRANDGUIDE.md. Colors are the guide's
       7 swatches only, plus the neutral canvas/border/muted values already
       established elsewhere. Built tablet/mobile-first on purpose (see
       README): this page is meant to run full-screen on a check-in table,
       not on a desk monitor, so touch targets are large (56px) and the
       default layout IS the narrow one — a min-width media query widens it
       for a desk browser, rather than the usual max-width-narrows pattern. */
    :root {
      --navy: #0c0f14; --navy-mid: #2c343a; --teal: #234048; --gold: #d3a422;
      --accent3: #708aa2; --red: #c44329;
      --ink: #2c343a; --muted: #5c6670; --border: #dcd8d0; --canvas: #f4f2ee; --white: #fff;
      --radius: 4px; --shadow: 0 4px 16px rgba(12,15,20,.08);
      --font-heading: 'Tiempos Fine', Georgia, serif;
      --font-subheading: Montserrat, 'Segoe UI', sans-serif;
      --font-body: 'Open Sans', system-ui, sans-serif;
      --tap: 56px;
      font-family: var(--font-body);
      color: var(--ink);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    /* Keeps the page pinned on phones: no sideways panning, no rubber-band
       bounce, no double-tap zoom. */
    html, body { height: 100%; overflow-x: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
    body { margin: 0; min-height: 100vh; background: var(--canvas); touch-action: manipulation; }
    img, canvas, video { max-width: 100%; }
    button, input { font: inherit; }

    header.top {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 18px;
      color: #fff; background: linear-gradient(120deg, var(--navy), var(--navy-mid));
      border-bottom: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 4px 18px rgba(12,15,20,.14);
    }
    header.top .wordmark { display: flex; align-items: center; color: inherit; text-decoration: none; }
    header.top .wordmark-logo { height: 22px; width: auto; }
    header.top .divider { width: 1px; height: 30px; background: rgba(255,255,255,.28); }
    header.top .page-title { display: inline-flex; align-items: center; gap: 8px; color: var(--gold); font: 700 .74rem var(--font-subheading); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
    header.top .page-title::before, header.top .page-title::after { content: ''; width: 14px; height: 1px; background: var(--gold); }
    header.top .spacer { flex: 1; }
    header.top .device-status { min-width: 0; font-size: .68rem; color: rgba(255,255,255,.6); text-align: right; line-height: 1.3; }

    main { width: min(640px, calc(100% - 32px)); margin: 0 auto; padding: 22px 0 60px; }

    .intro { margin: 0 0 20px; }
    .intro h1 { margin: 0; color: var(--navy); font: 700 clamp(1.5rem,6vw,2rem)/1.15 var(--font-heading); letter-spacing: -.015em; }
    .intro h1::after { content: ''; display: block; margin: 12px 0 12px; width: 44px; height: 3px; background: var(--gold); }
    .intro p { margin: 0; color: var(--muted); line-height: 1.5; font-size: .95rem; }

    #camera-scan-btn { width: 100%; margin-bottom: 18px; }
    button.primary {
      height: var(--tap); padding: 0 20px; border: 1px solid var(--teal); border-radius: var(--radius);
      color: #fff; background: var(--teal); cursor: pointer;
      font: 700 .82rem var(--font-subheading); letter-spacing: .07em; text-transform: uppercase;
      transition: background-color .18s ease, border-color .18s ease;
    }
    button.primary:hover:not(:disabled) { background: var(--navy); border-color: var(--navy); }
    button.primary:disabled { opacity: .55; cursor: default; }
    button.secondary {
      height: var(--tap); padding: 0 20px; border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--ink); background: var(--white); cursor: pointer;
      font: 700 .82rem var(--font-subheading); letter-spacing: .07em; text-transform: uppercase;
    }
    button.secondary:hover:not(:disabled) { border-color: var(--teal); color: var(--teal); }
    button.secondary:disabled { opacity: .55; cursor: default; }
    button.link {
      height: auto; padding: 0; border: 0; background: none; color: var(--teal); cursor: pointer;
      font: 700 .82rem var(--font-subheading); letter-spacing: .04em; text-decoration: underline;
    }

    .empty { padding: 26px 22px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--white); color: var(--muted); text-align: center; }

    .profile-card { padding: 26px 24px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--white); box-shadow: var(--shadow); }
    .profile-eyebrow { display: block; margin-bottom: 6px; color: var(--muted); font: 700 .68rem var(--font-subheading); letter-spacing: .12em; text-transform: uppercase; }
    .profile-name { margin: 0; color: var(--navy); font: 700 clamp(1.4rem,5vw,1.8rem)/1.2 var(--font-heading); }
    .profile-meta { margin: 10px 0 0; color: var(--muted); font-size: .92rem; }

    .qr-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; margin: 24px 0; padding: 22px; border: 1px dashed var(--border); border-radius: var(--radius); background: var(--canvas); }
    .qr-wrap canvas, .qr-wrap img { display: block; max-width: 100%; height: auto; background: #fff; padding: 10px; border-radius: var(--radius); }
    .qr-missing { color: var(--muted); text-align: center; font-size: .9rem; }

    .print-row { display: flex; flex-direction: column; gap: 10px; }
    .print-row .row { display: flex; gap: 10px; }
    .print-row button { flex: 1; }

    .banner {
      margin-bottom: 18px; padding: 14px 16px; border: 1px solid var(--gold); border-radius: var(--radius);
      background: var(--white); color: var(--ink); font-size: .88rem; line-height: 1.5;
    }
    .banner strong { color: var(--navy); }
    .banner.success { border-color: var(--teal); }
    .banner.error { border-color: var(--red); }

    .profile-actions { margin-top: 20px; display: flex; justify-content: center; }

    .camera-modal {
      position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 20px; background: rgba(12,15,20,.92);
    }
    .camera-modal video { width: min(480px, 100%); border-radius: var(--radius); background: #000; }
    .camera-modal .camera-status { color: #fff; font-size: .9rem; text-align: center; min-height: 1.2em; }
    .camera-modal button.secondary { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); }
    .camera-modal button.secondary:hover { border-color: #fff; color: #fff; }

    .print-station { margin-top: 40px; padding-top: 20px; border-top: 1px dashed var(--border); text-align: center; }
    .print-station-status { margin: 10px 0 0; color: var(--muted); font-size: .85rem; min-height: 1.2em; }

    .label-settings { margin-top: 20px; padding: 16px 18px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--white); text-align: left; }
    .label-settings summary { cursor: pointer; color: var(--navy); font: 700 .78rem var(--font-subheading); letter-spacing: .08em; text-transform: uppercase; }
    .label-settings[open] summary { margin-bottom: 14px; }
    .setting-field { display: grid; gap: 6px; margin-bottom: 12px; color: var(--muted); font-size: .85rem; }
    .setting-field input { height: 44px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius); color: var(--ink); font-size: 1rem; }
    .setting-field input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(35,64,72,.14); }
    .setting-check { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: .92rem; cursor: pointer; }
    .setting-check input { width: 18px; height: 18px; accent-color: var(--teal); }
    .label-preview { margin: 16px 0 12px; text-align: center; }
    .label-preview img { max-width: min(100%, 420px); max-height: 320px; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; }
    .label-settings button.secondary { width: 100%; }

    /* Print-only fallback layout, used when DYMO Connect isn't available:
       hidden on screen, shown (and everything else hidden) via @media print
       once #print-fallback is populated and window.print() is triggered. */
    #print-fallback { display: none; }
    @media print {
      body > *:not(#print-fallback) { display: none !important; }
      #print-fallback.printing { display: flex !important; flex-direction: column; align-items: center; gap: 8px; padding: 0; }
      #print-fallback canvas, #print-fallback img { width: 200px; height: 200px; }
      #print-fallback .print-name { font: 700 14pt var(--font-subheading, Arial, sans-serif); }
    }

    /* Tablet/mobile IS the default layout above. This widens things for a
       desk browser instead of narrowing a desktop-first layout down. */
    @media (min-width: 720px) {
      header.top { padding: 16px 28px; }
      main { padding-top: 30px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="wordmark" href="../../">
      <img class="wordmark-logo" src="../../assets/brand-new/gs-logo-horizontal-white.png" alt="Gateway Seminary">
    </a>
    <div class="divider"></div>
    <div class="page-title">Check-In</div>
    <div class="spacer"></div>
    <div id="device-status" class="device-status">Checking for DYMO Connect&hellip;</div>
  </header>

  <main>
    <div class="intro">
      <h1>Check in a registrant</h1>
      <p>Scan a badge with the camera to reprint its QR code.</p>
    </div>

    <div id="banners"></div>

    <button class="primary" id="camera-scan-btn" type="button">Scan with camera</button>

    <section id="profile" hidden></section>
    <div id="empty" class="empty">Tap "Scan with camera" to begin.</div>

    <div class="print-station" id="print-station">
      <button class="secondary" id="print-station-btn" type="button">Enable as print station</button>
      <p id="print-station-status" class="print-station-status"></p>

      <details class="label-settings">
        <summary>Label settings</summary>
        <label class="setting-field">
          <span>Event title</span>
          <input id="setting-title" type="text" maxlength="80" placeholder="e.g. Fall Preview Day 2026">
        </label>
        <label class="setting-check"><input id="setting-logo" type="checkbox"> Gateway logo in the header</label>
        <label class="setting-check"><input id="setting-name" type="checkbox"> Print the registrant's name</label>
        <label class="setting-check"><input id="setting-vertical" type="checkbox"> Vertical layout (name under the QR code)</label>
        <div class="label-preview">
          <img id="label-preview-img" alt="Label preview" hidden>
          <p id="label-preview-status" class="print-station-status"></p>
        </div>
        <button class="secondary" id="label-test-btn" type="button">Print a test label</button>
      </details>
    </div>
  </main>

  <div id="print-fallback"></div>
  <div id="camera-modal" class="camera-modal" hidden>
    <video id="camera-video" playsinline muted autoplay></video>
    <p id="camera-status" class="camera-status">Point the camera at a QR code.</p>
    <button class="secondary" id="camera-cancel-btn" type="button">Cancel</button>
  </div>

  <script>
  (function () {
    'use strict';

    // Same Cloudflare Worker every other portal talks to (gs-labs-slate-gateway).
    const WORKER_URL = 'https://gs-labs-slate-gateway.gs-labs.workers.dev';
    // per_qr_url (verified live 2026-09-22) is a link to a PNG Slate already
    // renders, not an opaque code — enroll.gs.edu sends no CORS headers, so
    // this route re-serves the bytes with CORS for the Dymo print path,
    // which needs to read pixels, not just display them. See
    // handleCheckinQrImage in tools/queryomatic/worker.js. This is kept even
    // though camera-scanned codes are never URL-shaped in practice, in case a
    // pasted/scanned value ever is.
    const CHECKIN_QR_IMAGE_SERVICE = WORKER_URL + '/api/slate/checkin-qr-image';
    // See "CHECK-IN PRINT QUEUE" in tools/queryomatic/worker.js — every
    // scanning device POSTs a decoded value here; whichever device is
    // running as the print station polls it and prints. See "Print station"
    // below.
    const PRINT_QUEUE_SERVICE = WORKER_URL + '/api/checkin/print-queue';

    const profile = document.getElementById('profile');
    const empty = document.getElementById('empty');
    const banners = document.getElementById('banners');
    const deviceStatus = document.getElementById('device-status');
    const printFallback = document.getElementById('print-fallback');
    const cameraScanBtn = document.getElementById('camera-scan-btn');
    const cameraModal = document.getElementById('camera-modal');
    const cameraVideo = document.getElementById('camera-video');
    const cameraStatus = document.getElementById('camera-status');
    const cameraCancelBtn = document.getElementById('camera-cancel-btn');
    const printStationBtn = document.getElementById('print-station-btn');
    const printStationStatusEl = document.getElementById('print-station-status');

    // Phones and tablets (incl. Kindle Fire's Silk browser, and iPads that
    // report as Macintosh) can't run DYMO Connect, so they're scanners only:
    // no print-station toggle, no DYMO status, no local Print buttons.
    const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile|Silk|Kindle/i.test(navigator.userAgent) ||
      (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
    if (IS_MOBILE) {
      document.getElementById('print-station').hidden = true;
      deviceStatus.hidden = true;
    }

    // per_qr_url is a link to an already-rendered PNG; treat anything else
    // (a bare code string) as text to encode ourselves instead.
    function isProbablyUrl(value) { return /^https?:\/\//i.test(value); }

    function qrImageProxyUrl(qrUrl) {
      const url = new URL(CHECKIN_QR_IMAGE_SERVICE);
      url.searchParams.set('url', qrUrl);
      return url.toString();
    }

    // ----------------------------------------------------------------
    // Rendering
    // ----------------------------------------------------------------

    function showOnly(section) {
      profile.hidden = section !== 'profile';
      empty.hidden = section !== 'empty';
    }

    function setBanner(message, kind) {
      banners.innerHTML = '';
      if (!message) return;
      const div = document.createElement('div');
      div.className = 'banner' + (kind ? ' ' + kind : '');
      div.textContent = message;
      banners.appendChild(div);
    }

    function renderProfile(person) {
      profile.innerHTML =
        '<div class="profile-card">' +
          '<span class="profile-eyebrow">Registrant</span>' +
          '<h2 class="profile-name"></h2>' +
          '<p class="profile-meta"></p>' +
          '<div class="qr-area"></div>' +
          '<div class="print-row">' +
            '<div class="row">' +
              '<button class="primary" id="print-btn" type="button">Print to Dymo</button>' +
            '</div>' +
            '<button class="secondary" id="print-fallback-btn" type="button" hidden>Print via browser dialog instead</button>' +
          '</div>' +
          '<p id="print-status" class="qr-missing" role="status" aria-live="polite"></p>' +
        '</div>' +
        '<div class="profile-actions"><button class="link" id="scan-again" type="button">&larr; Scan again</button></div>';

      profile.querySelector('.profile-name').textContent = person.name || 'Scanned pass';
      profile.querySelector('.profile-meta').textContent = [person.status, person.email, person.sisid].filter(Boolean).join(' · ') || 'No additional details on file';

      const qrArea = profile.querySelector('.qr-area');
      const printBtn = profile.querySelector('#print-btn');
      if (person.qrUrl && isProbablyUrl(person.qrUrl)) {
        const wrap = document.createElement('div');
        wrap.className = 'qr-wrap';
        const img = document.createElement('img');
        img.alt = 'QR code for ' + person.name;
        img.width = 220;
        img.height = 220;
        img.src = qrImageProxyUrl(person.qrUrl);
        img.addEventListener('error', function () { setBanner('Could not load the QR code image for this person.', 'error'); }, { once: true });
        wrap.appendChild(img);
        qrArea.appendChild(wrap);
      } else if (person.qrUrl && !window.QRCode) {
        const missing = document.createElement('p');
        missing.className = 'qr-missing';
        missing.textContent = 'QR preview unavailable (the QR library failed to load).';
        qrArea.appendChild(missing);
      } else if (person.qrUrl) {
        // Not URL-shaped — treat it as a raw value to encode client-side.
        const wrap = document.createElement('div');
        wrap.className = 'qr-wrap';
        const canvas = document.createElement('canvas');
        wrap.appendChild(canvas);
        qrArea.appendChild(wrap);
        window.QRCode.toCanvas(canvas, person.qrUrl, { width: 220, margin: 1 }, function (err) {
          if (err) setBanner('Could not render the QR code for this person.', 'error');
        });
      } else {
        const missing = document.createElement('p');
        missing.className = 'qr-missing';
        missing.textContent = 'No QR code on file for this person (per_qr_url is blank).';
        qrArea.appendChild(missing);
        printBtn.disabled = true;
      }

      if (IS_MOBILE) profile.querySelector('.print-row').hidden = true;

      profile.querySelector('#scan-again').addEventListener('click', function () {
        showOnly('empty');
      });
      printBtn.addEventListener('click', function () { printLabel(person); });
      profile.querySelector('#print-fallback-btn').addEventListener('click', function () { printViaBrowser(person); });

      showOnly('profile');
    }

    // ----------------------------------------------------------------
    // Dymo Connect printing
    //
    // The label schema is NOT the widely-documented <DieCutLabel> one —
    // this DYMO Connect installation rejects it outright ("The 'DieCutLabel'
    // element is not declared"). It accepts the newer
    // <DesktopLabel><DYMOLabel Version="4"> schema (what the SDK's
    // isDCDLabel() checks for). The object shapes below come from a label
    // saved in the DYMO Connect app itself (local-files/BTC/test.dymo) and
    // were checked with DYMO Connect's RenderLabel endpoint — see
    // tools/checkin/README.md, including how to iterate on a design without
    // spending labels.
    //
    // - The label XML is built with every value already filled in, rather
    //   than setObjectText() on a template, so what's previewed is exactly
    //   what prints.
    // - A QRCodeObject needs an opaque WHITE background and opaque black
    //   fill (QR_OBJECT_BRUSHES_XML), or it renders as an empty box while
    //   the print call still reports success.
    // - Coordinates are absolute label inches (DYMOPoint/Size), not twips.
    // - getPrinters() rows use the printerType value "LabelWriterPrinter".
    // ----------------------------------------------------------------

    // DYMO 30256 shipping label, 2-5/16" x 4", printed landscape. The
    // printable rect comes from the LabelWriter 450 driver's own entry for
    // Shipping30256 (PrintableOrigin 17,140 / PrintableArea 665,2224 at
    // 300x600 dpi, in Drivers/DLS/lw450c.gpd under DYMO Connect's install).
    const LABEL_STOCK = { name: 'LargeShipping', x: 0.2333, y: 0.0567, width: 3.7067, height: 2.2167 };
    const LABEL_MARGIN = 0.07;

    function xmlEscape(value) {
      return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
    }

    function objectLayoutXml(x, y, width, height) {
      return '<ObjectLayout><DYMOPoint><X>' + x.toFixed(4) + '</X><Y>' + y.toFixed(4) + '</Y></DYMOPoint>' +
        '<Size><Width>' + width.toFixed(4) + '</Width><Height>' + height.toFixed(4) + '</Height></Size></ObjectLayout>';
    }

    const COLOR_BLACK_XML = '<SolidColorBrush><Color A="1" R="0" G="0" B="0"></Color></SolidColorBrush>';

    const OBJECT_BRUSHES_XML =
      '<Brushes>' +
        '<BackgroundBrush><SolidColorBrush><Color A="0" R="0" G="0" B="0"></Color></SolidColorBrush></BackgroundBrush>' +
        '<BorderBrush>' + COLOR_BLACK_XML + '</BorderBrush>' +
        '<StrokeBrush>' + COLOR_BLACK_XML + '</StrokeBrush>' +
        '<FillBrush><SolidColorBrush><Color A="0" R="0" G="0" B="0"></Color></SolidColorBrush></FillBrush>' +
      '</Brushes>';

    const QR_OBJECT_BRUSHES_XML =
      '<Brushes>' +
        '<BackgroundBrush><SolidColorBrush><Color A="1" R="1" G="1" B="1"></Color></SolidColorBrush></BackgroundBrush>' +
        '<BorderBrush>' + COLOR_BLACK_XML + '</BorderBrush>' +
        '<StrokeBrush>' + COLOR_BLACK_XML + '</StrokeBrush>' +
        '<FillBrush>' + COLOR_BLACK_XML + '</FillBrush>' +
      '</Brushes>';

    const OBJECT_COMMON_XML =
      '<Rotation>Rotation0</Rotation>' +
      '<OutlineThickness>1</OutlineThickness>' +
      '<IsOutlined>False</IsOutlined>' +
      '<BorderStyle>SolidLine</BorderStyle>' +
      '<Margin><DYMOThickness Left="0" Top="0" Right="0" Bottom="0" /></Margin>';

    function textObjectXml(name, text, layoutXml, fontSize, bold, align) {
      return '<TextObject>' +
          '<Name>' + name + '</Name>' + OBJECT_BRUSHES_XML + OBJECT_COMMON_XML +
          '<HorizontalAlignment>' + align + '</HorizontalAlignment>' +
          '<VerticalAlignment>Middle</VerticalAlignment>' +
          '<FitMode>AlwaysFit</FitMode>' +
          '<IsVertical>False</IsVertical>' +
          '<FormattedText>' +
            '<FitMode>AlwaysFit</FitMode>' +
            '<HorizontalAlignment>' + align + '</HorizontalAlignment>' +
            '<VerticalAlignment>Middle</VerticalAlignment>' +
            '<IsVertical>False</IsVertical>' +
            [].concat(text).map(function (line) {
              return '<LineTextSpan><TextSpan>' +
                '<Text>' + xmlEscape(line) + '</Text>' +
                '<FontInfo>' +
                  '<FontName>Segoe UI</FontName>' +
                  '<FontSize>' + fontSize + '</FontSize>' +
                  '<IsBold>' + (bold ? 'True' : 'False') + '</IsBold>' +
                  '<IsItalic>False</IsItalic>' +
                  '<IsUnderline>False</IsUnderline>' +
                  '<FontBrush>' + COLOR_BLACK_XML + '</FontBrush>' +
                '</FontInfo>' +
              '</TextSpan></LineTextSpan>';
            }).join('') +
          '</FormattedText>' +
          layoutXml +
        '</TextObject>';
    }

    function qrObjectXml(text, layoutXml) {
      return '<QRCodeObject>' +
          '<Name>QR</Name>' + QR_OBJECT_BRUSHES_XML + OBJECT_COMMON_XML +
          '<BarcodeFormat>QRCode</BarcodeFormat>' +
          '<Data><DataString>' + xmlEscape(text) + '</DataString></Data>' +
          '<HorizontalAlignment>Center</HorizontalAlignment>' +
          '<VerticalAlignment>Middle</VerticalAlignment>' +
          '<Size>AutoFit</Size>' +
          '<EQRCodeType>QRCodeText</EQRCodeType>' +
          '<TextDataHolder><Value>' + xmlEscape(text) + '</Value></TextDataHolder>' +
          layoutXml +
        '</QRCodeObject>';
    }

    function imageObjectXml(name, pngBase64, layoutXml, horizontalAlignment, scaleMode) {
      return '<ImageObject>' +
          '<Name>' + name + '</Name>' + QR_OBJECT_BRUSHES_XML + OBJECT_COMMON_XML +
          '<Data>' + pngBase64 + '</Data>' +
          '<ScaleMode>' + (scaleMode || 'Uniform') + '</ScaleMode>' +
          '<HorizontalAlignment>' + horizontalAlignment + '</HorizontalAlignment>' +
          '<VerticalAlignment>Middle</VerticalAlignment>' +
          layoutXml +
        '</ImageObject>';
    }

    // A 1x1 black PNG, stretched (ScaleMode Fill) into the header rule.
    const BLACK_PIXEL_PNG_BASE64 = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAAAAAA6fptVAAAACklEQVR4nGNgAAAAAgABSK+kcQAAAABJRU5ErkJggg==';

    // AlwaysFit shrinks one long line until it's unreadable, so long text is
    // split at the space nearest its middle and printed on two lines.
    function splitInTwo(text, maxChars) {
      if (text.length <= maxChars || text.indexOf(' ') === -1) return [text];
      let splitAt = -1;
      for (let i = 0; i < text.length; i += 1) {
        if (text[i] === ' ' && (splitAt === -1 || Math.abs(i - text.length / 2) < Math.abs(splitAt - text.length / 2))) splitAt = i;
      }
      return [text.slice(0, splitAt), text.slice(splitAt + 1)];
    }

    // Header (logo, then event title, then a rule) across the top, then the
    // body centered in what's left. Horizontal: QR on the left, name to its
    // right. Vertical (portrait, 2.2in wide): a large QR with the name
    // centered under it. Anything switched off or blank is left out and the
    // body grows into the room.
    // opts: { vertical, logoBase64, title, name, qrText | qrImageBase64 }
    function buildLabelXml(opts) {
      // Portrait is the same printable rect with the axes swapped.
      const stock = opts.vertical
        ? { x: LABEL_STOCK.y, y: LABEL_STOCK.x, width: LABEL_STOCK.height, height: LABEL_STOCK.width }
        : LABEL_STOCK;
      const align = opts.vertical ? 'Center' : 'Left';
      const left = stock.x + LABEL_MARGIN;
      const right = stock.x + stock.width - LABEL_MARGIN;
      const bottom = stock.y + stock.height - LABEL_MARGIN;
      const objects = [];
      let top = stock.y + LABEL_MARGIN;

      if (opts.logoBase64) {
        const logoWidth = Math.min(2.0, right - left);
        const logoLeft = opts.vertical ? (left + right - logoWidth) / 2 : left;
        objects.push(imageObjectXml('LOGO', opts.logoBase64, objectLayoutXml(logoLeft, top, logoWidth, 0.26), align));
        top += 0.32;
      }
      if (opts.title) {
        const titleLines = opts.vertical ? splitInTwo(opts.title, 24) : [opts.title];
        const titleHeight = titleLines.length > 1 ? 0.5 : 0.32;
        objects.push(textObjectXml('TITLE', titleLines, objectLayoutXml(left, top, right - left, titleHeight), 16, true, align));
        top += titleHeight + 0.04;
      }
      if (opts.logoBase64 || opts.title) {
        objects.push(imageObjectXml('RULE', BLACK_PIXEL_PNG_BASE64, objectLayoutXml(left, top, right - left, 0.02), 'Left', 'Fill'));
        top += 0.08;
      }

      let qrLayout;
      let nameLayout;
      if (opts.vertical) {
        const nameHeight = opts.name ? 0.8 : 0;
        const gap = opts.name ? 0.12 : 0;
        const qrSize = Math.min(right - left, bottom - top - nameHeight - gap);
        const bodyTop = top + (bottom - top - qrSize - gap - nameHeight) / 2;
        qrLayout = objectLayoutXml((left + right - qrSize) / 2, bodyTop, qrSize, qrSize);
        nameLayout = objectLayoutXml(left, bodyTop + qrSize + gap, right - left, nameHeight);
      } else {
        const qrSize = Math.min(1.6, bottom - top);
        const bodyTop = top + (bottom - top - qrSize) / 2;
        qrLayout = opts.name
          ? objectLayoutXml(left, bodyTop, qrSize, qrSize)
          : objectLayoutXml((left + right - qrSize) / 2, bodyTop, qrSize, qrSize);
        const nameLeft = left + qrSize + 0.15;
        nameLayout = objectLayoutXml(nameLeft, bodyTop, right - nameLeft, qrSize);
      }

      objects.push(opts.qrImageBase64
        ? imageObjectXml('QR', opts.qrImageBase64, qrLayout, 'Center')
        : qrObjectXml(opts.qrText, qrLayout));
      if (opts.name) {
        objects.push(textObjectXml('NAME', splitInTwo(opts.name, 14), nameLayout, 28, true, align));
      }

      return '<?xml version="1.0" encoding="utf-8"?>' +
        '<DesktopLabel Version="1">' +
          '<DYMOLabel Version="4">' +
            '<Description>DYMO Label</Description>' +
            '<Orientation>' + (opts.vertical ? 'Portrait' : 'Landscape') + '</Orientation>' +
            '<LabelName>' + LABEL_STOCK.name + '</LabelName>' +
            '<InitialLength>0</InitialLength>' +
            '<BorderStyle>SolidLine</BorderStyle>' +
            '<DYMORect><DYMOPoint><X>' + stock.x + '</X><Y>' + stock.y + '</Y></DYMOPoint>' +
              '<Size><Width>' + stock.width + '</Width><Height>' + stock.height + '</Height></Size></DYMORect>' +
            '<BorderColor>' + COLOR_BLACK_XML + '</BorderColor>' +
            '<BorderThickness>1</BorderThickness>' +
            '<Show_Border>False</Show_Border>' +
            '<HasFixedLength>False</HasFixedLength>' +
            '<FixedLengthValue>0</FixedLengthValue>' +
            '<DynamicLayoutManager>' +
              '<RotationBehavior>ClearObjects</RotationBehavior>' +
              '<LabelObjects>' + objects.join('') + '</LabelObjects>' +
            '</DynamicLayoutManager>' +
          '</DYMOLabel>' +
          '<LabelApplication>Blank</LabelApplication>' +
          '<DataTable><Columns></Columns><Rows></Rows></DataTable>' +
        '</DesktopLabel>';
    }

    // ----------------------------------------------------------------
    // Label settings — kept in the print station's own browser, since only
    // the machine that prints needs them. Read fresh on every print, so
    // edits apply to the very next label.
    // ----------------------------------------------------------------

    const LABEL_SETTINGS_KEY = 'checkin.labelSettings';
    const DEFAULT_LABEL_SETTINGS = { title: '', showLogo: true, showName: true, vertical: false };

    function loadLabelSettings() {
      try {
        return Object.assign({}, DEFAULT_LABEL_SETTINGS, JSON.parse(localStorage.getItem(LABEL_SETTINGS_KEY) || '{}'));
      } catch (e) {
        return Object.assign({}, DEFAULT_LABEL_SETTINGS);
      }
    }

    function saveLabelSettings(settings) {
      try { localStorage.setItem(LABEL_SETTINGS_KEY, JSON.stringify(settings)); } catch (e) { /* private window etc. */ }
    }

    // The black horizontal logo, flattened onto white (a transparent PNG can
    // print as a solid black box) at ~300dpi for its 2in slot on the label.
    const LOGO_URL = '../../assets/brand-new/gs-logo-horizontal-black.png';
    let logoBase64Promise = null;

    function loadLogoBase64() {
      if (!logoBase64Promise) {
        logoBase64Promise = new Promise(function (resolve) {
          const img = new Image();
          img.onload = function () {
            const width = 600;
            const height = Math.round(width * img.naturalHeight / img.naturalWidth);
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/png').split(',')[1]);
          };
          img.onerror = function () { resolve(''); };
          img.src = LOGO_URL;
        });
      }
      return logoBase64Promise;
    }

    async function labelXmlFor(person) {
      const settings = loadLabelSettings();
      const opts = {
        vertical: Boolean(settings.vertical),
        logoBase64: settings.showLogo ? await loadLogoBase64() : '',
        title: settings.title.trim(),
        name: settings.showName ? (person.name || '') : '',
      };
      if (isProbablyUrl(person.qrUrl)) {
        const response = await fetch(qrImageProxyUrl(person.qrUrl), { cache: 'no-store' });
        if (!response.ok) throw new Error('QR image request returned ' + response.status);
        opts.qrImageBase64 = (await blobToDataUrl(await response.blob())).replace(/^data:image\/\w+;base64,/, '');
      } else {
        opts.qrText = person.qrUrl;
      }
      return buildLabelXml(opts);
    }

    function dymoAvailable() {
      try {
        return Boolean(window.dymo && window.dymo.label && window.dymo.label.framework && typeof window.dymo.label.framework.getPrinters === 'function');
      } catch (e) {
        return false;
      }
    }

    function findLabelPrinter(printers) {
      return (printers || []).find(function (p) { return p.printerType === 'LabelWriterPrinter'; });
    }

    function refreshDeviceStatus() {
      if (!dymoAvailable()) {
        deviceStatus.textContent = 'DYMO Connect not detected';
        return;
      }
      try {
        const labelPrinter = findLabelPrinter(window.dymo.label.framework.getPrinters());
        deviceStatus.textContent = labelPrinter ? ('DYMO ready — ' + labelPrinter.name) : 'DYMO Connect running, no label printer found';
      } catch (e) {
        deviceStatus.textContent = 'DYMO Connect present but unreachable';
      }
    }

    function blobToDataUrl(blob) {
      return new Promise(function (resolve, reject) {
        const reader = new FileReader();
        reader.onload = function () { resolve(reader.result); };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function printLabel(person) {
      const statusEl = profile.querySelector('#print-status');
      const fallbackBtn = profile.querySelector('#print-fallback-btn');
      statusEl.textContent = '';
      fallbackBtn.hidden = true;

      if (!dymoAvailable()) {
        statusEl.textContent = 'DYMO Connect isn’t available on this device.';
        fallbackBtn.hidden = false;
        return;
      }

      try {
        const labelPrinter = findLabelPrinter(window.dymo.label.framework.getPrinters());
        if (!labelPrinter) {
          statusEl.textContent = 'No Dymo label printer is connected.';
          fallbackBtn.hidden = false;
          return;
        }
        window.dymo.label.framework.openLabelXml(await labelXmlFor(person)).print(labelPrinter.name);
        statusEl.textContent = 'Sent to ' + labelPrinter.name + '.';
      } catch (err) {
        statusEl.textContent = 'Printing failed: ' + (err && err.message ? err.message : 'unknown error') + '.';
        fallbackBtn.hidden = false;
      }
    }

    // Fallback when DYMO Connect isn't installed/running: render the QR into
    // a print-only element and hand off to the browser's own print dialog,
    // so check-in can still produce a printable QR (on whatever printer the
    // OS print dialog offers) rather than being fully blocked.
    function printViaBrowser(person) {
      if (!person.qrUrl) return;
      if (isProbablyUrl(person.qrUrl)) {
        printFallback.innerHTML = '<img alt="">' + '<div class="print-name"></div>';
        printFallback.querySelector('.print-name').textContent = person.name;
        const img = printFallback.querySelector('img');
        img.addEventListener('load', function () {
          printFallback.classList.add('printing');
          window.print();
          printFallback.classList.remove('printing');
        }, { once: true });
        img.src = qrImageProxyUrl(person.qrUrl);
        return;
      }
      printFallback.innerHTML = '<canvas></canvas><div class="print-name"></div>';
      printFallback.querySelector('.print-name').textContent = person.name;
      const canvas = printFallback.querySelector('canvas');
      window.QRCode.toCanvas(canvas, person.qrUrl, { width: 300, margin: 1 }, function (err) {
        if (err) return;
        printFallback.classList.add('printing');
        window.print();
        printFallback.classList.remove('printing');
      });
    }

    // ----------------------------------------------------------------
    // Camera scan
    //
    // A scanned badge's code IS the check-in credential itself, so
    // reprinting it needs no Slate lookup at all — whatever the camera
    // decodes is encoded straight back out as the printed QR and sent to the
    // Dymo printer immediately, no manual "Print" step. (A maindb lookup by
    // scanned id was tried and abandoned 2026-09-22 — see
    // tools/checkin/README.md and the comment above CHECKIN_FIXED_PARAMS in
    // tools/queryomatic/worker.js.) renderProfile() already handles either
    // shape of decoded value: a Slate barcode-image URL goes through
    // qrImageProxyUrl/checkin-qr-image so Slate's own rendered PNG gets
    // printed byte-for-byte; a raw scanned payload (e.g.
    // "person:07f59624160e47eea4c10394429ea33f", with no "http" prefix) is
    // encoded fresh via QRCode.js instead — see isProbablyUrl().
    //
    // Prefers the native BarcodeDetector API (fast, no extra decode work per
    // frame) when it actually supports qr_code (checked via
    // barcodeDetectorSupportsQr() below — see its comment for why a bare
    // existence check isn't enough); falls back to jsQR (vendored via CDN,
    // see the <script> tag in <head>) otherwise, e.g. Safari/iOS as of this
    // writing, or a desktop Chrome build whose BarcodeDetector doesn't
    // support qr_code.
    // ----------------------------------------------------------------

    let cameraStream = null;
    let cameraRafId = null;
    let cameraCanvas = null;
    let cameraCanvasCtx = null;

    function stopCameraScan() {
      if (cameraRafId != null) { cancelAnimationFrame(cameraRafId); cameraRafId = null; }
      if (cameraStream) { cameraStream.getTracks().forEach(function (t) { t.stop(); }); cameraStream = null; }
      cameraVideo.srcObject = null;
      cameraModal.hidden = true;
    }

    // POSTs a decoded value to the shared print queue — see "CHECK-IN PRINT
    // QUEUE" in tools/queryomatic/worker.js. This is fire-and-forget from the
    // scanning device's point of view: it's this device's job to show what
    // was scanned, not to print it (it may have no printer at all, e.g. a
    // Kindle Fire — see tools/checkin/README.md).
    async function queueScannedValue(value) {
      const response = await fetch(PRINT_QUEUE_SERVICE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ value }),
      });
      if (!response.ok) throw new Error('Print queue request returned ' + response.status);
      return (await response.json()).job;
    }

    // Queues before rendering, so a preview failure can never stop the print
    // job from being sent. Status goes in the top banner, where it's visible
    // without scrolling past the QR preview on a phone.
    function handleDecodedValue(value) {
      stopCameraScan();
      setBanner('Sending to the print station…');
      const queued = queueScannedValue(value);
      const person = { name: '', email: '', status: '', sisid: '', qrUrl: value };
      try {
        renderProfile(person);
      } catch (err) {
        showOnly('empty');
      }
      window.scrollTo(0, 0);
      queued.then(
        function (job) {
          // The Worker looked the name up from the pass while queueing.
          if (job && job.name) profile.querySelector('.profile-name').textContent = job.name;
          setBanner('✓ Sent to the print station' + (job && job.name ? ': ' + job.name : '') + '.', 'success');
        },
        function (err) { setBanner('Could not reach the print station: ' + (err && err.message ? err.message : 'unknown error') + '.', 'error'); }
      );
    }

    async function scanFrameWithDetector(detector) {
      if (!cameraStream) return;
      try {
        const codes = await detector.detect(cameraVideo);
        if (codes && codes.length) { handleDecodedValue(codes[0].rawValue); return; }
      } catch (e) { /* transient decode errors are expected mid-stream */ }
      cameraRafId = requestAnimationFrame(function () { scanFrameWithDetector(detector); });
    }

    function scanFrameWithJsQR() {
      if (!cameraStream) return;
      if (cameraVideo.readyState === cameraVideo.HAVE_ENOUGH_DATA && cameraVideo.videoWidth) {
        cameraCanvas.width = cameraVideo.videoWidth;
        cameraCanvas.height = cameraVideo.videoHeight;
        cameraCanvasCtx.drawImage(cameraVideo, 0, 0, cameraCanvas.width, cameraCanvas.height);
        const imageData = cameraCanvasCtx.getImageData(0, 0, cameraCanvas.width, cameraCanvas.height);
        const code = window.jsQR && window.jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'attemptBoth' });
        if (code && code.data) { handleDecodedValue(code.data); return; }
      }
      cameraRafId = requestAnimationFrame(scanFrameWithJsQR);
    }

    // BarcodeDetector's existence doesn't guarantee it can actually decode
    // QR codes — some implementations expose the constructor but only
    // support a subset of formats (or none) via getSupportedFormats(), and
    // an unsupported detector silently detects nothing forever rather than
    // throwing, which looked from the outside like "the camera opens but
    // never scans anything". Checking supportedFormats up front and falling
    // back to jsQR (a plain, proven-in-JS decoder) whenever qr_code isn't
    // actually listed avoids that silent-failure mode.
    async function barcodeDetectorSupportsQr() {
      if (!window.BarcodeDetector) return false;
      try {
        const formats = await window.BarcodeDetector.getSupportedFormats();
        return Array.isArray(formats) && formats.includes('qr_code');
      } catch (e) {
        return false;
      }
    }

    async function startCameraScan() {
      if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return;
      cameraStatus.textContent = 'Point the camera at a QR code.';
      cameraModal.hidden = false;
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        cameraVideo.srcObject = cameraStream;
        await cameraVideo.play();
        if (await barcodeDetectorSupportsQr()) {
          const detector = new window.BarcodeDetector({ formats: ['qr_code'] });
          scanFrameWithDetector(detector);
        } else {
          cameraCanvas = document.createElement('canvas');
          cameraCanvasCtx = cameraCanvas.getContext('2d', { willReadFrequently: true });
          scanFrameWithJsQR();
        }
      } catch (err) {
        cameraStatus.textContent = 'Could not access the camera: ' + (err && err.message ? err.message : 'unknown error') + '.';
      }
    }

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      cameraScanBtn.hidden = false;
      cameraScanBtn.addEventListener('click', startCameraScan);
    }
    cameraCancelBtn.addEventListener('click', stopCameraScan);

    // ----------------------------------------------------------------
    // Print station
    //
    // The device with the Dymo actually plugged in (the only one that can
    // act on a scan) turns this on once; every OTHER device just scans and
    // queues (see queueScannedValue() above) without needing its own
    // printer or even to be on the same network — see "CHECK-IN PRINT
    // QUEUE" in tools/queryomatic/worker.js. Polling reuses
    // renderProfile()/printLabel() exactly as the local camera-scan path
    // does, so a job from the queue looks and prints identically to a badge
    // scanned on this device directly.
    // ----------------------------------------------------------------

    let printStationOn = false;
    let printStationBusy = false;
    const PRINT_STATION_POLL_MS = 2500;

    // The poll clock runs in a Web Worker because Edge/Chrome throttle
    // main-thread timers in a background or minimized tab to once a minute
    // (observed in Worker logs 2026-09-25: the station polled at exactly
    // 60s intervals). Worker timers are exempt, so the station stays at
    // 2.5s even when its tab isn't in front.
    const pollClock = new Worker(URL.createObjectURL(new Blob([
      'let t = null;' +
      'onmessage = function (e) {' +
      '  clearInterval(t); t = null;' +
      '  if (e.data === "start") { postMessage("tick"); t = setInterval(function () { postMessage("tick"); }, ' + PRINT_STATION_POLL_MS + '); }' +
      '};'
    ], { type: 'text/javascript' })));
    pollClock.onmessage = function () { pollPrintQueue(); };

    async function pollPrintQueue() {
      if (printStationBusy) return;
      printStationBusy = true;
      try {
        const response = await fetch(PRINT_QUEUE_SERVICE, { cache: 'no-store' });
        if (!response.ok) throw new Error('Print queue poll returned ' + response.status);
        const data = await response.json();
        const jobs = Array.isArray(data.jobs) ? data.jobs : [];
        for (let i = 0; i < jobs.length; i += 1) {
          const person = { name: jobs[i].name || '', email: '', status: '', sisid: '', qrUrl: jobs[i].value };
          renderProfile(person);
          await printLabel(person);
        }
        if (jobs.length) printStationStatusEl.textContent = 'Watching for scans… last printed ' + new Date().toLocaleTimeString() + '.';
        else printStationStatusEl.textContent = 'Watching for scans…';
      } catch (err) {
        printStationStatusEl.textContent = 'Print station error: ' + (err && err.message ? err.message : 'unknown error') + '.';
      } finally {
        printStationBusy = false;
      }
    }

    printStationBtn.addEventListener('click', function () {
      printStationOn = !printStationOn;
      printStationBtn.textContent = printStationOn ? 'Disable print station' : 'Enable as print station';
      if (printStationOn) {
        printStationStatusEl.textContent = 'Watching for scans…';
        pollClock.postMessage('start');
      } else {
        pollClock.postMessage('stop');
        printStationStatusEl.textContent = '';
      }
    });

    // ----------------------------------------------------------------
    // Label settings panel (desktop only — hidden with the rest of the
    // print-station section on mobile). Every change saves immediately and
    // re-renders the preview through DYMO Connect, so what's shown is what
    // DYMO Connect itself will print.
    // ----------------------------------------------------------------

    const settingTitle = document.getElementById('setting-title');
    const settingLogo = document.getElementById('setting-logo');
    const settingName = document.getElementById('setting-name');
    const settingVertical = document.getElementById('setting-vertical');
    const labelPreviewImg = document.getElementById('label-preview-img');
    const labelPreviewStatus = document.getElementById('label-preview-status');
    const SAMPLE_PERSON = { name: 'Sample Registrant', qrUrl: 'person:00000000000000000000000000000000' };
    let previewToken = 0;

    async function refreshLabelPreview() {
      const token = ++previewToken;
      if (!dymoAvailable()) {
        labelPreviewImg.hidden = true;
        labelPreviewStatus.textContent = 'Start DYMO Connect on this computer to see a preview.';
        return;
      }
      try {
        const labelPrinter = findLabelPrinter(window.dymo.label.framework.getPrinters());
        const png = await window.dymo.label.framework.renderLabelAsync(await labelXmlFor(SAMPLE_PERSON), '', labelPrinter ? labelPrinter.name : '');
        if (token !== previewToken) return;
        labelPreviewImg.src = 'data:image/png;base64,' + String(png).replace(/^"|"$/g, '');
        labelPreviewImg.hidden = false;
        labelPreviewStatus.textContent = '';
      } catch (err) {
        if (token !== previewToken) return;
        labelPreviewImg.hidden = true;
        labelPreviewStatus.textContent = 'Preview failed: ' + (err && err.message ? err.message : 'unknown error') + '.';
      }
    }

    let previewDebounce = null;
    function onSettingsChange() {
      saveLabelSettings({ title: settingTitle.value, showLogo: settingLogo.checked, showName: settingName.checked, vertical: settingVertical.checked });
      clearTimeout(previewDebounce);
      previewDebounce = setTimeout(refreshLabelPreview, 250);
    }

    if (!IS_MOBILE) {
      const initialSettings = loadLabelSettings();
      settingTitle.value = initialSettings.title;
      settingLogo.checked = initialSettings.showLogo;
      settingName.checked = initialSettings.showName;
      settingVertical.checked = initialSettings.vertical;
      [settingTitle, settingLogo, settingName, settingVertical].forEach(function (el) {
        el.addEventListener(el.type === 'checkbox' ? 'change' : 'input', onSettingsChange);
      });
      document.querySelector('.label-settings').addEventListener('toggle', function (event) {
        if (event.target.open) refreshLabelPreview();
      });
      document.getElementById('label-test-btn').addEventListener('click', function () {
        renderProfile(SAMPLE_PERSON);
        printLabel(SAMPLE_PERSON);
      });
    }

    refreshDeviceStatus();
    setInterval(refreshDeviceStatus, 15000);
  }());
  </script>
</body>
</html>
