name = "slate-idea-box"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
ALLOWED_ORIGIN = "https://cade-macritchie.github.io"

# Create with: wrangler d1 create slate-idea-box
# Then paste the returned database_id below and apply schema.sql:
#   wrangler d1 execute slate-idea-box --remote --file ./schema.sql
[[d1_databases]]
binding = "DB"
database_name = "slate-idea-box"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
