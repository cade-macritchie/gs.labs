<!--
  Advancement and Student Life Events Slate wrapper.
  The portal query/export name must remain public_events_registrants and must
  expose ev_title, reg_date, ev_date, and ev_link_slate for one row per event
  registrant. reg_date is the registration date; ev_date is the event date.
  reg_breakouts is optional: the registrant's chosen breakout sessions from
  the registration form's Breakout Sessions field. Set the export's separator
  to | (pipe) when Slate offers one so session titles containing commas stay
  intact; ;, tabs and line breaks also work, and a value with none of those is
  split on commas. The BTC 2027 form's Sessions field uses export key
  sessions_list, pulled with a Form Field Value export.

  Liquid renders the complete export before JavaScript reads or groups it.
  The Liquid size filter supplies the authoritative source-row total; the
  per-event counts are calculated from those rendered rows in the browser.
-->
<div id="publicEventRegistrantData" style="display:none">
  <span class="source-total">{{ public_events_registrants | size }}</span>
  <div class="registrations">
    {% for registrant in public_events_registrants %}
      <div class="registration">
        <span class="event-title">{{ registrant.ev_title | escape }}</span>
        <span class="registration-date">{{ registrant.reg_date | escape }}</span>
        <span class="event-date">{{ registrant.ev_date | escape }}</span>
        <span class="event-link">{{ registrant.ev_link_slate | escape }}</span>
        <span class="breakouts">{{ registrant.reg_breakouts | escape }}</span>
      </div>
    {% endfor %}
  </div>
</div>

<iframe id="publicEventRegistrantFrame" src="https://cade-macritchie.github.io/gs.labs/reports/advancement-student-life-events/?v=breakout-sessions-v1" title="Advancement and Student Life Events" referrerpolicy="origin" style="width:100%;height:100vh;min-height:600px;border:0;display:block"></iframe>

<script>
(function () {
  'use strict';

  const dashboard = 'public-event-registrants';
  const frameOrigin = 'https://cade-macritchie.github.io';
  const frame = document.getElementById('publicEventRegistrantFrame');
  const root = document.getElementById('publicEventRegistrantData');

  function read(node, selector) {
    const element = node && node.querySelector(selector);
    return element ? element.textContent.trim() : '';
  }

  function decodeEntities(value) {
    const named = { amp:'&', apos:"'", quot:'"', lt:'<', gt:'>', nbsp:'\u00a0' };
    let decoded = String(value == null ? '' : value);
    for (let pass = 0; pass < 3; pass += 1) {
      const next = decoded
        .replace(/&#x([0-9a-f]+);/gi, function (match, digits) {
          const code = parseInt(digits, 16);
          return Number.isInteger(code) && code <= 0x10ffff ? String.fromCodePoint(code) : match;
        })
        .replace(/&#(\d+);/g, function (match, digits) {
          const code = parseInt(digits, 10);
          return Number.isInteger(code) && code <= 0x10ffff ? String.fromCodePoint(code) : match;
        })
        .replace(/&([a-z]+);/gi, function (match, name) {
          return Object.prototype.hasOwnProperty.call(named, name.toLowerCase()) ? named[name.toLowerCase()] : match;
        });
      if (next === decoded) break;
      decoded = next;
    }
    return decoded;
  }

  function eventLink(value) {
    const raw = decodeEntities(value).trim();
    const href = raw.match(/\bhref\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/i);
    const candidate = String(href ? (href[1] || href[2] || href[3]) : raw).trim();
    if (!candidate) return '';
    try {
      const url = new URL(candidate, window.location.origin);
      return url.origin === window.location.origin ? url.href : '';
    } catch (_) {
      return '';
    }
  }

  function breakoutSessions(value) {
    const raw = decodeEntities(value).trim();
    if (!raw) return [];
    const parts = /[|;\t\n\r]/.test(raw) ? raw.split(/[|;\t\n\r]+/) : raw.split(',');
    const seen = new Set();
    return parts.map(function (part) { return part.replace(/\s+/g, ' ').trim(); }).filter(function (part) {
      const key = part.toLocaleLowerCase();
      if (!part || seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }

  const registrationRows = Array.from(root.querySelectorAll('.registration')).map(function (node) {
    return {
      title: read(node, '.event-title') || 'Untitled event',
      registrationDate: read(node, '.registration-date'),
      eventDate: read(node, '.event-date'),
      url: eventLink(read(node, '.event-link')),
      breakouts: breakoutSessions(read(node, '.breakouts'))
    };
  });

  // Tallies each registrant's chosen sessions onto their event, matching
  // session titles case-insensitively and keeping the first spelling seen.
  function addBreakouts(group, sessions) {
    if (!sessions.length) return;
    group.breakoutRespondents += 1;
    sessions.forEach(function (name) {
      const key = name.toLocaleLowerCase();
      const existing = group.breakoutCounts.get(key);
      if (existing) existing.count += 1;
      else group.breakoutCounts.set(key, { name: name, count: 1 });
    });
  }

  const eventGroups = new Map();
  registrationRows.forEach(function (registration) {
    const key = registration.title.trim().toLocaleLowerCase();
    const existing = eventGroups.get(key);
    if (existing) {
      existing.registrants += 1;
      existing.registrationDates.push(registration.registrationDate);
      if (!existing.date && registration.eventDate) existing.date = registration.eventDate;
      if (!existing.url && registration.url) existing.url = registration.url;
      addBreakouts(existing, registration.breakouts);
    } else {
      const group = {
        title: registration.title,
        date: registration.eventDate,
        registrants: 1,
        registrationDates: [registration.registrationDate],
        url: registration.url,
        breakoutRespondents: 0,
        breakoutCounts: new Map()
      };
      addBreakouts(group, registration.breakouts);
      eventGroups.set(key, group);
    }
  });

  const liquidTotal = Number(read(root, '.source-total'));
  const payload = {
    events: Array.from(eventGroups.values()).map(function (group) {
      return {
        title: group.title,
        date: group.date,
        registrants: group.registrants,
        registrationDates: group.registrationDates,
        url: group.url,
        breakouts: Array.from(group.breakoutCounts.values()),
        breakoutRespondents: group.breakoutRespondents
      };
    }),
    totalRegistrants: Number.isFinite(liquidTotal) ? liquidTotal : registrationRows.length
  };

  function sendData() {
    if (frame.contentWindow) {
      frame.contentWindow.postMessage({
        type: 'enrollment-dashboard-data',
        dashboard: dashboard,
        payload: payload
      }, frameOrigin);
    }
  }

  function openEvent(value) {
    try {
      const url = new URL(String(value || ''), window.location.origin);
      if (url.origin === window.location.origin) window.open(url.href, '_blank', 'noopener');
    } catch (_) {}
  }

  window.addEventListener('message', function (event) {
    if (event.origin !== frameOrigin || event.source !== frame.contentWindow || !event.data || event.data.dashboard !== dashboard) return;
    if (event.data.type === 'enrollment-dashboard-ready') sendData();
    if (event.data.type === 'enrollment-dashboard-open-record') openEvent(event.data.url);
    if (event.data.type === 'enrollment-dashboard-resize') {
      frame.style.height = Math.max(600, Math.min(Number(event.data.height) || 600, 10000)) + 'px';
    }
  });

  frame.addEventListener('load', sendData);
}());
</script>
