<!--
  Record Lookup Slate wrapper.

  This wrapper does not require a portal query. It calls the configured Slate
  JSON service as the user searches a combined name/SIS ID field, then sends
  matching rows to the GitHub-hosted interface.

  all_people JSON fields: per_status, per_name, per_email, per_phone, per_sisid,
  per_pipeline, per_teachingsite, per_birthdate, per_url, per_location_code,
  app_created_date, app_degree, app_round, app_status, app_term, app_year,
  app_f1, app_url, app_missing_mats_list, app_full_mats_list.
  The additional-applications JSON service accepts sisid and returns per_sisid,
  app_degree, app_round, app_status, app_term, app_year, app_f1, and
  app_created_date. It is called only when an opened record has Student status.
  Legacy field aliases remain as fallbacks during rollout.
-->
<iframe id="studentLookupFrame" src="https://cade-macritchie.github.io/gs.labs/tools/student-lookup/?v=student-lookup-v24" title="Record Lookup" referrerpolicy="origin" style="width:100%;height:600px;min-height:600px;border:0;display:block"></iframe>
<script>
(function () {
  'use strict';
  // Shared gateway key. It comes from the one-line key snippet pasted ABOVE
  // this wrapper in the Slate portal view and is never committed to this repo.
  // See the PORTAL_KEY notes in tools/queryomatic/worker.js.
  const gatewayHeaders = window.GS_GATEWAY_KEY
    ? { Accept:'application/json', 'X-GS-Key':String(window.GS_GATEWAY_KEY) }
    : { Accept:'application/json' };
  const frameOrigin = 'https://cade-macritchie.github.io';
  // Every Slate query below is proxied through the GS Labs Slate Gateway
  // Cloudflare Worker, which injects the real Slate query id/token
  // server-side — see tools/queryomatic/worker.js. Nothing Slate-credential
  // related is ever hardcoded here.
  const workerBase = 'https://gs-labs-slate-gateway.gs-labs.workers.dev';
  const recordsService = workerBase + '/api/slate/records';
  const additionalApplicationsService = workerBase + '/api/slate/additional-applications';
  const frame = document.getElementById('studentLookupFrame');
  const pageUrl = new URL(window.location.href);
  const legacySearch = [pageUrl.searchParams.get('first'), pageUrl.searchParams.get('last'), pageUrl.searchParams.get('sisid')].filter(Boolean).join(' ');
  const query = { search:pageUrl.searchParams.get('search') || legacySearch };
  const searched = Boolean(query.search);
  let frameReady = false;
  let sendStarted = false;
  let contentHeight = 600;

  function text(value) {
    return value == null ? '' : String(value).trim();
  }

  function scalar(value, preferredKeys) {
    if (!value || typeof value !== 'object') return value;
    const keys = preferredKeys || ['display','label','name','value','text','url','href'];
    for (let index = 0; index < keys.length; index += 1) {
      if (value[keys[index]] != null) return value[keys[index]];
    }
    return '';
  }

  function decodeEntities(value) {
    const textarea = document.createElement('textarea');
    textarea.innerHTML = text(value);
    return textarea.value;
  }

  function plain(value) {
    return decodeEntities(scalar(value)).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function readableName(value) {
    const normalized = plain(value);
    const parts = normalized.split(',').map(function (part) { return part.trim(); }).filter(Boolean);
    return parts.length > 1 ? parts.slice(1).concat(parts[0]).join(' ') : normalized;
  }

  function materialList(value) {
    const source = decodeEntities(scalar(value))
      .replace(/<br\s*\/?\s*>/gi, '\n')
      .replace(/<\/(?:li|p|div|tr)>/gi, '\n')
      .replace(/<[^>]*>/g, ' ');
    const items = [];
    let item = '';
    let parenthesisDepth = 0;
    function finishItem() {
      const normalized = item.replace(/\s+/g, ' ').trim();
      if (normalized) items.push(normalized);
      item = '';
    }
    for (const character of source) {
      if (character === '(') parenthesisDepth += 1;
      if (character === ')' && parenthesisDepth > 0) parenthesisDepth -= 1;
      if ((character === '\n' || character === '\r' || character === ',' || character === ';' || character === '|') && parenthesisDepth === 0) finishItem();
      else item += /\s/.test(character) ? ' ' : character;
    }
    finishItem();
    return items.join('\n');
  }

  function link(value) {
    const raw = decodeEntities(scalar(value, ['url','href','value','text']));
    const href = raw.match(/\bhref\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/i);
    return text(href ? (href[1] || href[2] || href[3]) : raw);
  }

  function linkLabel(value) {
    const raw = decodeEntities(scalar(value));
    return /<a\b/i.test(raw) ? plain(raw) : '';
  }

  function field(row, names) {
    if (!row || typeof row !== 'object') return '';
    const requested = Array.isArray(names) ? names : [names];
    for (let index = 0; index < requested.length; index += 1) {
      if (row[requested[index]] != null && text(scalar(row[requested[index]]))) return row[requested[index]];
    }
    const keys = Object.keys(row);
    for (let index = 0; index < requested.length; index += 1) {
      const normalized = requested[index].toLowerCase().replace(/[^a-z0-9]/g, '');
      const match = keys.find(function (key) { return key.toLowerCase().replace(/[^a-z0-9]/g, '') === normalized && text(scalar(row[key])); });
      if (match) return row[match];
    }
    return '';
  }

  function rowsFrom(response) {
    if (Array.isArray(response)) return response;
    if (response && Array.isArray(response.row)) return response.row;
    return response && response.row ? [response.row] : [];
  }

  function searchVariants(search) {
    const normalized = text(search).replace(/\s+/g, ' ');
    if (!normalized) return [];
    const parts = Array.from(new Set(normalized.split(' '))).sort(function (left, right) { return right.length - left.length; });
    const variants = [];
    parts.forEach(function (part) {
      variants.push({ first:part, last:'', sisid:'' });
      variants.push({ first:'', last:part, sisid:'' });
      if (/\d/.test(part)) variants.push({ first:'', last:'', sisid:part });
    });
    return variants;
  }

  function fold(value) {
    return text(value).toLocaleLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ');
  }

  function searchTerms(search) {
    return fold(search).split(' ').filter(Boolean);
  }

  function matchesSearch(candidate, search) {
    const terms = searchTerms(search);
    if (!terms.length) return true;
    if (terms.length === 1 && /\d/.test(terms[0])) return text(candidate.SIS_ID).toLocaleLowerCase().includes(terms[0]);
    const candidateName = fold([candidate.first, candidate.last, candidate.name].filter(Boolean).join(' '));
    return terms.every(function (term) { return candidateName.includes(term); });
  }

  // PARTIAL FIRST-NAME MATCHES. Slate's first/last filters are exact, so
  // "cathy" finds people whose first name is Cathy but not Cathleen. After the
  // exact search, each word of 3+ letters is also sent as first_prefix (its
  // first PARTIAL_STEM_LENGTH letters: "cathy" -> "cath"), a "begins with"
  // filter on the first name. Those people are listed after the exact matches
  // and flagged match:'partial'. Nicknames play no part: partial matching uses
  // the legal first and last name only (per_first/per_last), never the
  // "(Cathy)" in per_name. Every word must start like a first- or last-name
  // word ("cathleen g" -> Cathleen Gardner). Skipped for SIS ID searches, and
  // when a multi-word search already matched someone word for word
  // ("cathleen gardner"), so a full name still opens the profile directly.
  const PARTIAL_STEM_LENGTH = 4;
  const PARTIAL_MIN_LETTERS = 3;
  const PARTIAL_MAX_RESULTS = 25;

  function partialPrefixes(search) {
    return Array.from(new Set(searchTerms(search).map(function (term) {
      return term.replace(/[^\p{L}'-]/gu, '').slice(0, PARTIAL_STEM_LENGTH);
    }).filter(function (prefix) { return (prefix.match(/\p{L}/gu) || []).length >= PARTIAL_MIN_LETTERS; })));
  }

  function legalNameWords(candidate) {
    return fold([candidate.legal_first, candidate.legal_last].filter(Boolean).join(' ') || text(candidate.name).replace(/\([^)]*\)/g, ' '))
      .split(/[\s-]+/).filter(Boolean);
  }

  function matchesPartially(candidate, search) {
    const words = legalNameWords(candidate);
    return searchTerms(search).every(function (term) {
      const stem = term.slice(0, PARTIAL_STEM_LENGTH);
      return words.some(function (word) { return word.startsWith(stem); });
    });
  }

  function matchesWordForWord(candidate, search) {
    const terms = searchTerms(search);
    const words = legalNameWords(candidate);
    return terms.length > 1 && terms.every(function (term) { return words.includes(term); });
  }

  // Slate may export several applications per person as concatenated lists in
  // each app_* field (values separated by APP_LIST_DELIMITER, in matching
  // order). Secondary applications are only built when more than
  // APP_MULTI_FIELD_THRESHOLD of the app_* fields actually hold multiple
  // values, so a stray delimiter inside one value is not mistaken for a list.
  const APP_LIST_DELIMITER = '|';
  const APP_MULTI_FIELD_THRESHOLD = 3;

  function splitApplicationList(raw) {
    return plain(raw).split(APP_LIST_DELIMITER).map(function (part) { return part.trim(); });
  }

  function splitMaterials(raw, count) {
    const parts = decodeEntities(scalar(raw)).split(APP_LIST_DELIMITER);
    return parts.length === count ? parts.map(function (part) { return materialList(part); }) : null;
  }

  function embeddedApplications(row, sisid) {
    const keys = {
      app_degree:['app_degree','app_program','per_degree_current'], app_round:['app_round'], app_status:['app_status'],
      app_created_date:['app_created_date','application_created_date'], decision_code:['decision_code','app_decision_code','app_code'],
      app_term:['app_term'], app_year:['app_year'], app_f1:['app_f1']
    };
    const lists = {};
    let count = 1;
    let multiFields = 0;
    Object.keys(keys).forEach(function (key) {
      lists[key] = splitApplicationList(field(row, keys[key]));
      if (lists[key].length > 1) { multiFields += 1; count = Math.max(count, lists[key].length); }
    });
    if (multiFields <= APP_MULTI_FIELD_THRESHOLD) return [];
    const missing = splitMaterials(field(row, ['app_missing_mats_list','missing_mats_list']), count);
    const full = splitMaterials(field(row, ['app_full_mats_list','full_mats_list']), count);
    const applications = [];
    for (let index = 0; index < count; index += 1) {
      const application = { SIS_ID:sisid, app_url:'', missing_mats_list:missing ? missing[index] : '', full_mats_list:full ? full[index] : '' };
      Object.keys(keys).forEach(function (key) { application[key] = lists[key][index] || ''; });
      applications.push(application);
    }
    return applications;
  }

  function normalize(row, index) {
    const rawName = field(row, ['per_name','name','full_name','fullname','person_name']);
    const rawPersonUrl = field(row, ['per_url','url','record_url','person_url']);
    const first = plain(field(row, ['first','first_name','firstname']));
    const last = plain(field(row, ['last','last_name','lastname']));
    const name = readableName(rawName) || readableName(linkLabel(rawPersonUrl)) || [first, last].filter(Boolean).join(' ');
    const nameParts = name.split(/\s+/).filter(Boolean);
    const resolvedFirst = first || (nameParts.length > 1 ? nameParts.slice(0, -1).join(' ') : name);
    const resolvedLast = last || (nameParts.length > 1 ? nameParts[nameParts.length - 1] : '');
    const sisid = plain(field(row, ['per_sisid','sisid','SIS_ID','SISID','student_id']));
    const embedded = embeddedApplications(row, plain(field(row, ['per_sisid','sisid','SIS_ID','SISID','student_id'])));
    const lead = embedded[0] || null;
    function appValue(key, names) { return lead ? lead[key] : plain(field(row, names)); }
    const createdDate = appValue('app_created_date', ['app_created_date','application_created_date']);
    const appDegree = appValue('app_degree', ['app_degree','app_program','per_degree_current']);
    return {
      embedded_applications: embedded,
      SIS_ID: sisid,
      first: resolvedFirst,
      last: resolvedLast,
      legal_first: plain(field(row, ['per_first'])),
      legal_last: plain(field(row, ['per_last'])),
      match: 'exact',
      status: plain(field(row, ['per_status','status'])),
      name: name,
      email: plain(field(row, ['per_email','email'])),
      phone: plain(field(row, ['per_phone','phone'])),
      pipeline: plain(field(row, ['per_pipeline','pipeline'])),
      teachingsite: plain(field(row, ['per_teachingsite','teachingsite','teaching_site'])),
      location_code: plain(field(row, ['per_location_code','location_code','locationcode'])),
      birthdate: plain(field(row, ['per_birthdate','per_birtdate','birthdate','birth_date'])),
      app_created_date: createdDate,
      record_created_date: createdDate,
      decision_code: appValue('decision_code', ['decision_code','app_decision_code','app_code']),
      vear: appValue('app_year', 'app_year'),
      year: appValue('app_year', 'app_year'),
      term: appValue('app_term', 'app_term'),
      program: appDegree,
      church: '',
      url: link(rawPersonUrl) || link(rawName),
      app_degree: appDegree,
      app_round: appValue('app_round', 'app_round'),
      app_status: appValue('app_status', 'app_status'),
      app_term: appValue('app_term', 'app_term'),
      app_year: appValue('app_year', 'app_year'),
      app_f1: appValue('app_f1', 'app_f1'),
      app_url: link(field(row, ['app_url','application_url'])),
      missing_mats_list: lead ? lead.missing_mats_list : materialList(field(row, ['app_missing_mats_list','missing_mats_list'])),
      full_mats_list: lead ? lead.full_mats_list : materialList(field(row, ['app_full_mats_list','full_mats_list']))
    };
  }

  function normalizeApplication(row) {
    return {
      SIS_ID: plain(field(row, ['per_sisid','sisid','SIS_ID','SISID','student_id'])),
      app_degree: plain(field(row, ['app_degree','app_program','per_degree_current','degree','program'])),
      app_round: plain(field(row, ['app_round','application_round'])),
      app_status: plain(field(row, ['app_status','application_status'])),
      app_term: plain(field(row, ['app_term','term'])),
      app_year: plain(field(row, ['app_year','year'])),
      app_f1: plain(field(row, ['app_f1','f1'])),
      app_created_date: plain(field(row, ['app_created_date','application_created_date'])),
      decision_code: appValue('decision_code', ['decision_code','app_decision_code','app_code']),
      app_url: link(field(row, ['app_url','application_url'])),
      missing_mats_list: materialList(field(row, ['app_missing_mats_list','missing_mats_list'])),
      full_mats_list: materialList(field(row, ['app_full_mats_list','full_mats_list']))
    };
  }

  async function fetchRecords(variants) {
    const responses = await Promise.allSettled(variants.map(async function (values) {
      const url = new URL(recordsService);
      Object.keys(values).forEach(function (key) { url.searchParams.set(key, values[key]); });
      const response = await fetch(url.toString().replace(/\+/g, '%20'), { credentials:'same-origin', cache:'no-store', headers:gatewayHeaders });
      if (!response.ok) throw new Error('Record Lookup query returned ' + response.status);
      return rowsFrom(await response.json());
    }));
    const successful = responses.filter(function (response) { return response.status === 'fulfilled'; });
    if (!successful.length && responses.length) throw responses[0].reason;
    return successful.flatMap(function (response) { return response.value; }).map(normalize);
  }

  function candidateKey(candidate) {
    return candidate.SIS_ID || candidate.url || [candidate.name,candidate.email].join('|').toLowerCase();
  }

  function uniqueCandidates(candidates, seen) {
    return candidates.filter(function (candidate) {
      const key = candidateKey(candidate);
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }

  async function findCandidates(search) {
    const seen = new Set();
    const exact = uniqueCandidates((await fetchRecords(searchVariants(search))).filter(function (candidate) {
      return matchesSearch(candidate, search);
    }), seen);
    const prefixes = partialPrefixes(search);
    const skipPartial = !prefixes.length || /\d/.test(search) || exact.some(function (candidate) { return matchesWordForWord(candidate, search); });
    if (skipPartial) return exact;
    let partial = [];
    try {
      partial = uniqueCandidates((await fetchRecords(prefixes.map(function (prefix) { return { first_prefix:prefix }; }))).filter(function (candidate) {
        return matchesPartially(candidate, search);
      }), seen);
    } catch (error) {
      // Exact matches still show if the partial search fails.
      console.error('Unable to load Record Lookup partial matches.', error);
    }
    return exact.concat(partial.slice(0, PARTIAL_MAX_RESULTS).map(function (candidate) {
      return Object.assign(candidate, { match:'partial' });
    }));
  }

  async function loadData() {
    const payload = { searched:searched, resultCount:0, query:query, candidates:[], profile:null };
    if (!searched) return payload;
    try {
      payload.candidates = await findCandidates(query.search);
      payload.resultCount = payload.candidates.length;
    } catch (error) {
      console.error('Unable to load Record Lookup records.', error);
      payload.loadError = 'Unable to load records from Slate. Please try again.';
    }
    return payload;
  }

  const dataPromise = loadData();

  async function sendData() {
    if (!frameReady || sendStarted) return;
    sendStarted = true;
    const payload = await dataPromise;
    if (frame.contentWindow) frame.contentWindow.postMessage({ type:'student-lookup-data', payload:payload }, frameOrigin);
  }

  async function sendSelectedCandidate(studentId) {
    const payload = await dataPromise;
    const selected = payload.candidates.find(function (candidate) { return candidate.SIS_ID === text(studentId); });
    if (!selected || !frame.contentWindow) return;
    frame.contentWindow.postMessage({
      type:'student-lookup-data',
      payload:{ searched:true, resultCount:1, query:query, candidates:[selected], profile:selected }
    }, frameOrigin);
  }

  function updateSearch(values) {
    const url = new URL(window.location.href);
    ['first','last','sisid'].forEach(function (key) { url.searchParams.delete(key); });
    const value = text(values && values.search).slice(0, 100);
    if (value) url.searchParams.set('search', value);
    else url.searchParams.delete('search');
    window.location.assign(url.toString().replace(/\+/g, '%20'));
  }

  async function sendSuggestions(search, requestId) {
    try {
      const candidates = (await findCandidates(text(search).slice(0, 100))).slice(0, 8);
      if (frame.contentWindow) frame.contentWindow.postMessage({ type:'student-lookup-suggestions', requestId:requestId, candidates:candidates }, frameOrigin);
    } catch (error) {
      console.error('Unable to load Record Lookup suggestions.', error);
      if (frame.contentWindow) frame.contentWindow.postMessage({ type:'student-lookup-suggestions', requestId:requestId, candidates:[] }, frameOrigin);
    }
  }

  async function sendAdditionalApplications(studentId, requestId) {
    const normalizedStudentId = text(studentId).slice(0, 50);
    if (!normalizedStudentId || !frame.contentWindow) return;
    try {
      const url = new URL(additionalApplicationsService);
      url.searchParams.set('sisid', normalizedStudentId);
      const response = await fetch(url.toString().replace(/\+/g, '%20'), { credentials:'same-origin', cache:'no-store', headers:gatewayHeaders });
      if (!response.ok) throw new Error('Additional applications query returned ' + response.status);
      const applications = rowsFrom(await response.json()).map(normalizeApplication).filter(function (application) {
        return application.SIS_ID === normalizedStudentId;
      });
      if (frame.contentWindow) frame.contentWindow.postMessage({ type:'student-lookup-applications', requestId:requestId, studentId:normalizedStudentId, applications:applications }, frameOrigin);
    } catch (error) {
      console.error('Unable to load additional Record Lookup applications.', error);
      if (frame.contentWindow) frame.contentWindow.postMessage({ type:'student-lookup-applications', requestId:requestId, studentId:normalizedStudentId, applications:[], error:true }, frameOrigin);
    }
  }

  function viewportHeight() {
    const top = Math.max(0, frame.getBoundingClientRect().top);
    return Math.max(600, Math.ceil(window.innerHeight - top));
  }

  function resizeFrame(height) {
    if (height != null) contentHeight = Math.max(600, Math.min(Number(height) || 600, 10000));
    frame.style.height = Math.max(contentHeight, viewportHeight()) + 'px';
  }

  window.addEventListener('message', function (event) {
    if (event.origin !== frameOrigin || event.source !== frame.contentWindow || !event.data) return;
    if (event.data.type === 'student-lookup-resize') resizeFrame(event.data.height);
    if (event.data.type === 'student-lookup-scroll-top') frame.scrollIntoView({ block:'start' });
    if (event.data.type === 'student-lookup-select' && event.data.studentId) sendSelectedCandidate(event.data.studentId);
    if (event.data.type === 'student-lookup-suggest' && text(event.data.search).length >= 2) sendSuggestions(event.data.search, event.data.requestId);
    if (event.data.type === 'student-lookup-applications-request' && event.data.studentId && text(event.data.recordStatus).toLowerCase() === 'student') sendAdditionalApplications(event.data.studentId, event.data.requestId);
    if (event.data.type === 'student-lookup-search') updateSearch(event.data.values);
  });
  frame.addEventListener('load', function () {
    frameReady = true;
    resizeFrame();
    sendData();
  });
  window.addEventListener('resize', function () { resizeFrame(); });
  resizeFrame();
}());
</script>
