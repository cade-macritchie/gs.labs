<!--
  Regional Campus Slate wrapper.

  This page needs NO Liquid query configured on the Slate portal page. Every
  record comes from one request to the GS Labs Slate Gateway, which runs the
  shared maindb ("all people") query — the only person query this repo still
  holds a token for.

  How the data is assembled
  -------------------------
  The gateway route (/api/slate/regional-campus-people, see
  handleRegionalCampusPeople in tools/queryomatic/worker.js) runs maindb once
  per campus per person status, because the statuses need different parameters:

    Inquiry, Prospect      person_created_date_start / _end  (the period window)
    Applicant, Student     term + year

  maindb's term/year parameters filter on the APPLICATION's term and year, so
  asking for status=Inquiry together with term/year returns zero rows every
  time — an inquiry has no application. That was why this portal's inquiry
  counts were empty. Pre-application statuses are scoped by when the person
  record was created instead.

  The campus lives in the campus_assigned PARAMETER and is not one of the
  columns maindb returns, so there is nothing to group by — the gateway asks
  for each campus by name and stamps the answer onto its rows as "campus".
  campus_assigned partitions the population exactly (the campuses sum to the
  full 5,837-person total), so no record is lost or double-counted. Hawaii and
  Boston legitimately come back empty: people affiliated with them sit in a
  pipeline or a teaching site rather than being assigned there.

  Selecting a campus or a status narrows the fan-out; the result is cached for
  five minutes per campus|term|year|status combination.

  Columns this reads (all present on every maindb row):
    per_status, per_name, per_email, per_phone, per_sisid,
    per_degree_current, per_url

  There is no app_degree column — the program column reads per_degree_current.
  The unprefixed spellings are kept as fallbacks so a differently-shaped row
  still renders.
-->
<iframe id="regionalCampusFrame" src="https://cade-macritchie.github.io/gs.labs/reports/regional-campus/?v=regional-campus-v3" title="Regional Campus Portal" referrerpolicy="origin" style="width:100%;height:100vh;min-height:600px;border:0;display:block"></iframe>
<script>
(function () {
  'use strict';
  const dashboard = 'regional-campus';
  const frameOrigin = 'https://cade-macritchie.github.io';
  // The gateway injects the Slate query id/token server-side — see
  // tools/queryomatic/worker.js. Nothing credential-related is ever here.
  const workerBase = 'https://gs-labs-slate-gateway.gs-labs.workers.dev';
  const peopleService = workerBase + '/api/slate/regional-campus-people';
  // Only used if the gateway is unreachable, so the campus picker still
  // renders. The live list arrives with the people.
  const fallbackCampuses = [
    'Arizona Regional Campus',
    'Bay Area Campus',
    'Boston',
    'Hawaii Campus',
    'Online Campus',
    'Ontario Campus',
    'Pacific Northwest Campus',
    'Rocky Mountain Campus'
  ];
  const frame = document.getElementById('regionalCampusFrame');
  const pageUrl = new URL(window.location.href);
  const payload = {
    filters: {
      campus: pageUrl.searchParams.get('campus') || '',
      term: pageUrl.searchParams.get('term') || '',
      year: pageUrl.searchParams.get('year') || '',
      status: pageUrl.searchParams.get('status') || ''
    },
    campuses: [],
    records: [],
    // Set by the gateway. True means the period could not be applied to the
    // pre-application statuses, so their counts are all-time.
    preApplicationAllTime: false
  };
  const allowedParams = new Set(['campus', 'term', 'year', 'status']);
  let frameReady = false;
  let sendStarted = false;
  let dataPromise;

  function text(value) {
    return value == null ? '' : String(value).trim();
  }

  function isInquiryStatus(value) {
    return /^inquir(?:y|ies)\b/i.test(text(value));
  }

  function rowsFrom(response) {
    if (Array.isArray(response)) return response;
    if (response && Array.isArray(response.row)) return response.row;
    return response && response.row ? [response.row] : [];
  }

  // The maindb query names its columns per_*/app_*; the unprefixed spellings
  // are kept as fallbacks so a differently-shaped row still renders.
  function pick(row, names) {
    for (let index = 0; index < names.length; index += 1) {
      const value = text(row && row[names[index]]);
      if (value) return value;
    }
    return '';
  }

  // Slate returns "Last, First"; the other portals flip it for display.
  function readableName(value) {
    const parts = text(value).split(',').map(function (part) { return part.trim(); }).filter(Boolean);
    return parts.length > 1 ? parts.slice(1).concat(parts[0]).join(' ') : text(value);
  }

  function normalize(row, campus) {
    const first = pick(row, ['first', 'first_name']);
    const last = pick(row, ['last', 'last_name']);
    const status = pick(row, ['per_status', 'status']);
    const sisid = pick(row, ['per_sisid', 'sisid', 'SIS_ID', 'SISID']);
    const recordUrl = pick(row, ['per_url', 'record_url']) || (sisid
      ? window.location.origin + '/manage/database/record?lookup=' + encodeURIComponent(sisid)
      : '');
    return {
      campus: campus,
      term: pick(row, ['app_term', 'term']) || payload.filters.term,
      year: pick(row, ['app_year', 'year']) || payload.filters.year,
      name: readableName(pick(row, ['per_name', 'name'])) || [first, last].filter(Boolean).join(' '),
      sisid: sisid,
      record_url: recordUrl,
      email: pick(row, ['per_email', 'email']),
      phone: pick(row, ['per_phone', 'phone']),
      status: isInquiryStatus(status) ? 'Inquiry' : status,
      app_status: pick(row, ['app_status']),
      program: pick(row, ['per_degree_current', 'app_degree', 'program'])
    };
  }

  async function fetchPeople() {
    const url = new URL(peopleService);
    // The gateway turns these into the right Slate parameters per status; see
    // its header comment.
    Object.keys(payload.filters).forEach(function (key) {
      const value = text(payload.filters[key]);
      if (value) url.searchParams.set(key, value);
    });
    const controller = new AbortController();
    const timeout = window.setTimeout(function () { controller.abort(); }, 60000);
    try {
      const response = await fetch(url.toString().replace(/\+/g, '%20'), {
        credentials: 'same-origin',
        cache: 'no-store',
        signal: controller.signal,
        headers: { Accept:'application/json' }
      });
      if (!response.ok) throw new Error('Regional campus query returned ' + response.status);
      return await response.json();
    } finally {
      window.clearTimeout(timeout);
    }
  }

  function build(body) {
    const campuses = Array.isArray(body && body.campuses) ? body.campuses.map(text).filter(Boolean) : [];
    payload.campuses = campuses.length ? campuses : fallbackCampuses.slice();
    const selectedCampus = text(payload.filters.campus);
    if (selectedCampus && !payload.campuses.includes(selectedCampus)) payload.campuses.push(selectedCampus);
    if (typeof body.preApplicationAllTime === 'boolean') payload.preApplicationAllTime = body.preApplicationAllTime;

    // The gateway already applied the campus, period and status filters, so
    // every row it returns belongs in the table.
    payload.records = rowsFrom(body).map(function (row) {
      return normalize(row, text(row && row.campus) || selectedCampus);
    });

    const failed = Array.isArray(body && body.failedCampuses) ? body.failedCampuses : [];
    if (failed.length) {
      payload.loadError = 'Some campus records could not be loaded: ' + failed.join(', ') + '.';
    }
    return payload;
  }

  async function loadData() {
    try {
      return build(await fetchPeople());
    } catch (error) {
      console.error('Regional campus query failed.', error);
      payload.loadError = 'Unable to load regional campus records from Slate. Please try again.';
      payload.campuses = fallbackCampuses.slice();
      return payload;
    }
  }

  async function sendData() {
    if (!frameReady || sendStarted) return;
    sendStarted = true;
    const resolvedPayload = await dataPromise;
    if (frame.contentWindow) frame.contentWindow.postMessage({ type:'enrollment-dashboard-data', dashboard:dashboard, payload:resolvedPayload }, frameOrigin);
  }

  function navigate(message) {
    const url = new URL(window.location.href);
    Object.keys(message.set || {}).forEach(function (key) {
      const value = text(message.set[key]);
      if (allowedParams.has(key) && value.length <= 100) url.searchParams.set(key, value);
    });
    (message.remove || []).forEach(function (key) { if (allowedParams.has(key)) url.searchParams.delete(key); });
    window.location.assign(url.toString().replace(/\+/g, '%20'));
  }

  function openRecord(value) {
    try {
      const url = new URL(String(value || ''), window.location.origin);
      if (url.origin === window.location.origin) window.open(url.href, '_blank', 'noopener');
    } catch (_) {}
  }

  window.addEventListener('message', function (event) {
    if (event.origin !== frameOrigin || event.source !== frame.contentWindow || !event.data || event.data.dashboard !== dashboard) return;
    if (event.data.type === 'enrollment-dashboard-ready') {
      frameReady = true;
      sendData();
    }
    if (event.data.type === 'enrollment-dashboard-resize') frame.style.height = Math.max(600, Math.min(Number(event.data.height) || 600, 10000)) + 'px';
    if (event.data.type === 'enrollment-dashboard-navigate') navigate(event.data);
    if (event.data.type === 'enrollment-dashboard-open-record') openRecord(event.data.url);
  });
  frame.addEventListener('load', function () {
    frameReady = true;
    sendData();
  });
  dataPromise = loadData();
}());
</script>
