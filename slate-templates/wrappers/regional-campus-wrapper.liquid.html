<!--
  Regional Campus Slate wrapper.

  The wrapper reads the campus values from Queryomatic's Slate
  prompt/options service. It calls the records JSON service with campus, term,
  and year for applicants and students. Inquiries come from a separate,
  inquiry-only JSON service that accepts campus.
  The wrapper normalizes and combines the rows before sending them to the iframe.

  General JSON fields: first, last, email, phone, sisid, program, status, app_status
  Inquiry JSON fields: first, last, email, phone, sisid
-->
<iframe id="regionalCampusFrame" src="https://cade-macritchie.github.io/gs.labs/reports/regional-campus/?v=regional-campus-v2" title="Regional Campus Portal" referrerpolicy="origin" style="width:100%;height:100vh;min-height:600px;border:0;display:block"></iframe>
<script>
(function () {
  'use strict';
  const dashboard = 'regional-campus';
  const frameOrigin = 'https://cade-macritchie.github.io';
  // Every Slate query below is proxied through the GS Labs Slate Gateway
  // Cloudflare Worker, which injects the real Slate query id/token
  // server-side — see tools/queryomatic/worker.js. Nothing Slate-credential
  // related is ever hardcoded here.
  const workerBase = 'https://gs-labs-slate-gateway.gs-labs.workers.dev';
  const optionsService = workerBase + '/api/slate/portal-options';
  const recordsService = workerBase + '/api/slate/regional-campus-records';
  const inquiryService = workerBase + '/api/slate/inquiries';
  const fallbackCampuses = [
    'Arizona Regional Campus',
    'Bay Area Campus',
    'Boston',
    'Hawaii Campus',
    'Online Campus',
    'Ontario Campus',
    'Pacific Northwest Campus',
    'Rocky Mountain Campus'
  ];
  const frame = document.getElementById('regionalCampusFrame');
  const pageUrl = new URL(window.location.href);
  const payload = {
    filters: {
      campus: pageUrl.searchParams.get('campus') || '',
      term: pageUrl.searchParams.get('term') || '',
      year: pageUrl.searchParams.get('year') || '',
      status: pageUrl.searchParams.get('status') || ''
    },
    campuses: [],
    records: []
  };
  const allowedParams = new Set(['campus', 'term', 'year', 'status']);
  let frameReady = false;
  let sendStarted = false;
  let dataPromise;

  function text(value) {
    return value == null ? '' : String(value).trim();
  }

  function isInquiryStatus(value) {
    return /^inquir(?:y|ies)\b/i.test(text(value));
  }

  function rowsFrom(response) {
    if (Array.isArray(response)) return response;
    if (response && Array.isArray(response.row)) return response.row;
    return response && response.row ? [response.row] : [];
  }

  async function loadCampusValues() {
    const controller = new AbortController();
    const timeout = window.setTimeout(function () { controller.abort(); }, 10000);
    try {
      const response = await fetch(optionsService, {
        credentials: 'same-origin',
        cache: 'no-store',
        signal: controller.signal,
        headers: { Accept:'application/json' }
      });
      if (!response.ok) throw new Error('Queryomatic options query returned ' + response.status);
      const campuses = rowsFrom(await response.json()).filter(function (row) {
        return text(row && row.key).toLowerCase() === 'campus';
      }).map(function (row) { return text(row && row.value); }).filter(function (campus) {
        return campus && campus.toLowerCase() !== 'doctor of ministry';
      });
      if (!campuses.length) throw new Error('Queryomatic options did not return any campus values.');
      return campuses;
    } catch (error) {
      console.warn('Unable to load campuses from Queryomatic; using the wrapper fallback list.', error);
      return fallbackCampuses.slice();
    } finally {
      window.clearTimeout(timeout);
    }
  }

  // The maindb query names its columns per_*/app_*; the unprefixed spellings
  // are kept as fallbacks so a differently-shaped row still renders.
  function pick(row, names) {
    for (let index = 0; index < names.length; index += 1) {
      const value = text(row && row[names[index]]);
      if (value) return value;
    }
    return '';
  }

  // Slate returns "Last, First"; the other portals flip it for display.
  function readableName(value) {
    const parts = text(value).split(',').map(function (part) { return part.trim(); }).filter(Boolean);
    return parts.length > 1 ? parts.slice(1).concat(parts[0]).join(' ') : text(value);
  }

  function normalize(row, campus) {
    const first = pick(row, ['first', 'first_name']);
    const last = pick(row, ['last', 'last_name']);
    const status = pick(row, ['per_status', 'status']);
    const sisid = pick(row, ['per_sisid', 'sisid', 'SIS_ID', 'SISID']);
    const recordUrl = pick(row, ['per_url', 'record_url']) || (sisid
      ? window.location.origin + '/manage/database/record?lookup=' + encodeURIComponent(sisid)
      : '');
    return {
      campus: campus,
      term: pick(row, ['app_term', 'term']) || payload.filters.term,
      year: pick(row, ['app_year', 'year']) || payload.filters.year,
      name: readableName(pick(row, ['per_name', 'name'])) || [first, last].filter(Boolean).join(' '),
      sisid: sisid,
      record_url: recordUrl,
      email: pick(row, ['per_email', 'email']),
      phone: pick(row, ['per_phone', 'phone']),
      status: isInquiryStatus(status) ? 'Inquiry' : status,
      app_status: pick(row, ['app_status']),
      program: pick(row, ['per_degree_current', 'app_degree', 'program'])
    };
  }

  async function fetchRecords(url) {
    const response = await fetch(url.toString().replace(/\+/g, '%20'), {
      credentials: 'same-origin',
      cache: 'no-store',
      headers: { Accept:'application/json' }
    });
    if (!response.ok) throw new Error('Regional campus query returned ' + response.status);
    return rowsFrom(await response.json());
  }

  async function fetchCampusGeneralRecords(campus) {
    const url = new URL(recordsService);
    url.searchParams.set('campus', campus);
    url.searchParams.set('term', payload.filters.term);
    url.searchParams.set('year', payload.filters.year);
    return (await fetchRecords(url)).map(function (row) { return normalize(row, campus); });
  }

  async function fetchCampusInquiries(campus) {
    const url = new URL(inquiryService);
    url.searchParams.set('campus', campus);
    return (await fetchRecords(url)).map(function (row) {
      const record = normalize(row, campus);
      record.status = 'Inquiry';
      return record;
    });
  }

  async function fetchCampusRecords(campus) {
    const selectedStatus = text(payload.filters.status).toLowerCase();
    const requests = [{ type:'general', promise:fetchCampusGeneralRecords(campus) }];
    if (!selectedStatus || selectedStatus === 'inquiry') {
      requests.push({ type:'inquiries', promise:fetchCampusInquiries(campus) });
    }

    const results = await Promise.all(requests.map(async function (request) {
      try {
        return { type:request.type, records:await request.promise, error:false };
      } catch (error) {
        console.error('Regional campus ' + request.type + ' query failed for ' + campus + '.', error);
        return { type:request.type, records:[], error:true };
      }
    }));

    const general = results.find(function (result) { return result.type === 'general'; }) || { records:[], error:true };
    const inquiries = results.find(function (result) { return result.type === 'inquiries'; });
    const generalInquiries = general.records.filter(function (record) { return isInquiryStatus(record.status); });
    const generalNonInquiries = general.records.filter(function (record) { return !isInquiryStatus(record.status); });
    const resolvedInquiries = inquiries && inquiries.records.length ? inquiries.records : generalInquiries;
    const records = selectedStatus === 'inquiry'
      ? resolvedInquiries
      : generalNonInquiries.concat(selectedStatus ? [] : resolvedInquiries);

    const generalUnavailable = general.error && selectedStatus !== 'inquiry';
    const inquiryUnavailable = inquiries && inquiries.error && !generalInquiries.length;
    return {
      records: records,
      error: Boolean(generalUnavailable || inquiryUnavailable)
    };
  }

  async function loadRecords(campuses) {
    const selectedCampus = text(payload.filters.campus);
    payload.campuses = Array.from(new Set(campuses.map(text).filter(Boolean))).sort(function (a, b) { return a.localeCompare(b); });
    if (selectedCampus && !payload.campuses.includes(selectedCampus)) payload.campuses.push(selectedCampus);
    const requestedCampuses = selectedCampus ? [selectedCampus] : payload.campuses;

    if (!requestedCampuses.length) {
      payload.loadError = 'Unable to load the regional campus list.';
      return payload;
    }

    const results = await Promise.all(requestedCampuses.map(async function (campus) {
      const result = await fetchCampusRecords(campus);
      return { campus:campus, records:result.records, error:result.error };
    }));

    payload.records = results.reduce(function (records, result) { return records.concat(result.records); }, []);
    const failedCampuses = results.filter(function (result) { return result.error; }).map(function (result) { return result.campus; });
    if (failedCampuses.length) {
      payload.loadError = failedCampuses.length === requestedCampuses.length
        ? 'Unable to load regional campus records from Slate. Please try again.'
        : 'Some campus records could not be loaded: ' + failedCampuses.join(', ') + '.';
    }

    const selectedStatus = text(payload.filters.status).toLowerCase();
    if (selectedStatus) {
      payload.records = payload.records.filter(function (record) { return text(record.status).toLowerCase() === selectedStatus; });
    }
    return payload;
  }

  async function loadData() {
    return loadRecords(await loadCampusValues());
  }

  async function sendData() {
    if (!frameReady || sendStarted) return;
    sendStarted = true;
    const resolvedPayload = await dataPromise;
    if (frame.contentWindow) frame.contentWindow.postMessage({ type:'enrollment-dashboard-data', dashboard:dashboard, payload:resolvedPayload }, frameOrigin);
  }

  function navigate(message) {
    const url = new URL(window.location.href);
    Object.keys(message.set || {}).forEach(function (key) {
      const value = text(message.set[key]);
      if (allowedParams.has(key) && value.length <= 100) url.searchParams.set(key, value);
    });
    (message.remove || []).forEach(function (key) { if (allowedParams.has(key)) url.searchParams.delete(key); });
    window.location.assign(url.toString().replace(/\+/g, '%20'));
  }

  function openRecord(value) {
    try {
      const url = new URL(String(value || ''), window.location.origin);
      if (url.origin === window.location.origin) window.open(url.href, '_blank', 'noopener');
    } catch (_) {}
  }

  window.addEventListener('message', function (event) {
    if (event.origin !== frameOrigin || event.source !== frame.contentWindow || !event.data || event.data.dashboard !== dashboard) return;
    if (event.data.type === 'enrollment-dashboard-ready') {
      frameReady = true;
      sendData();
    }
    if (event.data.type === 'enrollment-dashboard-resize') frame.style.height = Math.max(600, Math.min(Number(event.data.height) || 600, 10000)) + 'px';
    if (event.data.type === 'enrollment-dashboard-navigate') navigate(event.data);
    if (event.data.type === 'enrollment-dashboard-open-record') openRecord(event.data.url);
  });
  frame.addEventListener('load', function () {
    frameReady = true;
    sendData();
  });
  dataPromise = loadData();
}());
</script>
