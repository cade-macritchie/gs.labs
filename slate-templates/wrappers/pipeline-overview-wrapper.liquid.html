<!--
  Pipeline Overview Slate wrapper.
  Configure pipeline_persons to use the status, term, and year URL parameters.
  The total_* exports are fixed comparison populations and should not use the
  term or year parameters.
-->
<div id="pipelineOverviewData" style="display:none">
  <div class="totals"><span class="applications">{{ total_apps.size }}</span><span class="inquiries">{{ total_inquiries.size }}</span><span class="prospects">{{ total_prospects.size }}</span><span class="students">{{ total_students.size }}</span></div>
  <div class="records">{% for record in pipeline_persons %}<div class="record"><span class="title">{{ record.title | escape }}</span></div>{% endfor %}</div>
</div>
<iframe id="pipelineOverviewFrame" src="https://cade-macritchie.github.io/gs.labs/pipeline-overview/" title="Pipeline Overview" referrerpolicy="origin" style="width:100%;height:100vh;min-height:600px;border:0;display:block"></iframe>
<script>
(function () {
  'use strict';
  const dashboard = 'pipeline-overview';
  const frameOrigin = 'https://cade-macritchie.github.io';
  const frame = document.getElementById('pipelineOverviewFrame');
  const root = document.getElementById('pipelineOverviewData');
  const read = (node, key) => { const el = node && node.querySelector('.' + key); return el ? el.textContent.trim() : ''; };
  const number = value => Number(value) || 0;
  const pageUrl = new URL(window.location.href);
  const payload = {
    filters: { status: pageUrl.searchParams.get('status') || 'applicant', term: pageUrl.searchParams.get('term') || '', year: pageUrl.searchParams.get('year') || '' },
    totals: { applications: number(read(root.querySelector('.totals'), 'applications')), inquiries: number(read(root.querySelector('.totals'), 'inquiries')), prospects: number(read(root.querySelector('.totals'), 'prospects')), students: number(read(root.querySelector('.totals'), 'students')) },
    records: Array.from(root.querySelectorAll('.record')).map(node => ({ title: read(node, 'title') }))
  };
  const allowedParams = new Set(['status', 'term', 'year']);
  function sendData() { if (frame.contentWindow) frame.contentWindow.postMessage({ type:'enrollment-dashboard-data', dashboard, payload }, frameOrigin); }
  function navigate(message) {
    const url = new URL(window.location.href);
    Object.keys(message.set || {}).forEach(key => { const value = String(message.set[key] || '').trim(); if (allowedParams.has(key) && value.length <= 100) url.searchParams.set(key, value); });
    (message.remove || []).forEach(key => { if (allowedParams.has(key)) url.searchParams.delete(key); });
    window.location.assign(url.toString());
  }
  window.addEventListener('message', function (event) {
    if (event.origin !== frameOrigin || event.source !== frame.contentWindow || !event.data || event.data.dashboard !== dashboard) return;
    if (event.data.type === 'enrollment-dashboard-ready') sendData();
    if (event.data.type === 'enrollment-dashboard-resize') frame.style.height = Math.max(600, Math.min(Number(event.data.height) || 600, 10000)) + 'px';
    if (event.data.type === 'enrollment-dashboard-navigate') navigate(event.data);
  });
  frame.addEventListener('load', sendData);
}());
</script>
