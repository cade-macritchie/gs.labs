<!--
  Teaching Sites Slate wrapper.

  This page needs NO Liquid query configured on the Slate portal page. Every
  number and every record it shows comes from one request to the GS Labs Slate
  Gateway, which runs the shared maindb ("all people") query — the only person
  query this repo still holds a token for.

  How the data is assembled
  -------------------------
  The gateway route (/api/slate/teaching-site-people, see
  handleTeachingSitePeople in tools/queryomatic/worker.js) runs maindb three
  times, once per funnel stage, because the stages need different parameters:

    inquiries     status=Inquiry   + person_created_date_start/_end
    applications  status=Applicant + term + year
    students      status=Student   + term + year

  maindb's term/year parameters filter on the APPLICATION's term and year, so
  asking for status=Inquiry together with term/year returns zero rows every
  time — an inquiry has no application. Inquiries are scoped by when the person
  record was created instead, using the calendar window for the selected period
  (PERSON_CREATED_WINDOWS in the worker).

  If a period has no window configured the gateway falls back to an all-time
  inquiry count and sets inquiriesAllTime; this page passes that through so the
  report can label the stat rather than let it be mistaken for a per-period
  count.

  maindb has no "teaching site is set" parameter either, so the gateway drops
  rows with a blank per_teachingsite before responding. The portal receives a
  few hundred rows, already grouped into stages, and derives every count,
  bar and drilldown table from them.

  Columns this reads (all present on every maindb row):
    per_status, per_teachingsite, per_name, per_email, per_phone,
    per_sisid, per_degree_current, per_url

  Note there is no app_degree column — the program column reads
  per_degree_current. Fuzzy fallbacks are kept for the rest so a Slate-side
  rename degrades a single column instead of blanking the table.
-->
<iframe id="teachingSiteOverviewFrame" src="https://cade-macritchie.github.io/gs.labs/reports/teaching-site-overview/?v=teaching-sites-v3" title="Teaching Sites Overview" referrerpolicy="origin" style="width:100%;height:100vh;min-height:600px;border:0;display:block"></iframe>
<script>
(function () {
  'use strict';
  const dashboard = 'teaching-site-overview';
  const frameOrigin = 'https://cade-macritchie.github.io';
  // The gateway injects the Slate query id/token server-side — see
  // tools/queryomatic/worker.js. Nothing credential-related is ever here.
  const workerBase = 'https://gs-labs-slate-gateway.gs-labs.workers.dev';
  const peopleService = workerBase + '/api/slate/teaching-site-people';
  // Only used if the gateway is unreachable, so the "inactive sites" list still
  // renders something. The live list arrives with the people.
  const fallbackTeachingSites = [
    'Agricola in Finland',
    'Bakersfield Site at Kern County Southern Baptist Association',
    'Boston School of Ministry',
    'Burbank Site at Story City Church',
    'Colorado Springs Site at Cross Fellowship Church',
    'Fort Collins Site at Gateway Seminary Northern Colorado',
    'Fountain Valley Site at First Chinese Baptist Church',
    'Fresno Site at Woodward Park Baptist Church',
    'Honk Kong Site at Kwun Tong Swatow Baptist Church',
    'Honk Kong Site at Saddleback Church',
    'Honolulu Site at Hawaii Pacific School of Theology',
    'Lake Havasu Site at Calvary Baptist Church',
    'Las Vegas Site at Nevada Southern Baptist Convention',
    'Lviv Site at Ukrainian Baptist Theological Seminary',
    'Mesa Site at HiWay Baptist Church',
    'Milpitas Site at New Vision Church',
    'Phoenix Site at Valley Life Church',
    'Sacramento Site at SOL Bible Academy',
    'Salt Lake School of Theology',
    'San Diego Site at Grace Church',
    'Taipei Teaching Site',
    'Valley Baptist University, Bakersfield',
    'Wyoming Site in Casper'
  ];
  const stages = ['inquiries', 'applications', 'students'];
  const stageLabels = { inquiries:'Inquiry', applications:'Applicant', students:'Student' };
  const frame = document.getElementById('teachingSiteOverviewFrame');
  const pageUrl = new URL(window.location.href);
  if (pageUrl.searchParams.has('status')) {
    pageUrl.searchParams.delete('status');
    window.location.replace(pageUrl.toString().replace(/\+/g, '%20'));
    return;
  }
  const payload = {
    filters: { term: pageUrl.searchParams.get('term') || '', year: pageUrl.searchParams.get('year') || '', site: pageUrl.searchParams.get('site') || '' },
    summary: { inquiries:0, applications:0, students:0 },
    funnel: { inquiries:0, applications:0, students:0 },
    funnelRecords: { inquiries:[], applications:[], students:[] },
    funnelRecordErrors: {},
    records: [],
    studentsBySite: [],
    teachingSites: [],
    // Set by the gateway. True only when the period could not be applied to
    // the inquiry stage, in which case the report page renders a note.
    inquiriesAllTime: true
  };
  const allowedParams = new Set(['term', 'year', 'site']);
  const removableParams = new Set(['status', 'term', 'year', 'site']);

  // ---------- value helpers (maindb returns HTML-ish strings in some columns)

  function scalar(value, preferredKeys) {
    if (!value || typeof value !== 'object') return value;
    const keys = preferredKeys || ['display','label','name','value','text','url','href'];
    for (let index = 0; index < keys.length; index += 1) {
      if (value[keys[index]] != null) return value[keys[index]];
    }
    return '';
  }
  function decodeEntities(value) {
    const textarea = document.createElement('textarea');
    textarea.innerHTML = value == null ? '' : String(scalar(value));
    return textarea.value;
  }
  function plain(value) {
    return decodeEntities(value).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function readableName(value) {
    const normalized = plain(value);
    const parts = normalized.split(',').map(part => part.trim()).filter(Boolean);
    return parts.length > 1 ? parts.slice(1).concat(parts[0]).join(' ') : normalized;
  }
  function recordLink(value) {
    const raw = decodeEntities(value);
    const href = raw.match(/\bhref\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/i);
    if (href) return String(href[1] || href[2] || href[3]).trim();
    const candidate = String(raw).trim();
    if (/^manage\//i.test(candidate)) return '/' + candidate;
    return /^(?:https?:\/\/|\/)/i.test(candidate) ? candidate : '';
  }
  // Prefers maindb's real column names, then falls back to a normalized match
  // so a Slate-side rename degrades one column instead of blanking the table.
  function field(row, keys) {
    const names = Array.isArray(keys) ? keys : [keys];
    for (let index = 0; index < names.length; index += 1) {
      const value = scalar(row && row[names[index]]);
      if (value != null && String(value).trim()) return value;
    }
    const available = row && typeof row === 'object' ? Object.keys(row) : [];
    for (let index = 0; index < names.length; index += 1) {
      const normalized = names[index].toLowerCase().replace(/[^a-z0-9]/g, '');
      const match = available.find(key => key.toLowerCase().replace(/[^a-z0-9]/g, '') === normalized && plain(row[key]));
      if (match) return scalar(row[match]);
    }
    return '';
  }
  function teachingSite(row) {
    return plain(field(row, ['per_teachingsite','teachingsite','teaching_site','site','title']));
  }
  function normalizeRecord(row, stage) {
    const rawName = field(row, ['per_name','name','display_name','full_name','person_name']);
    const rawUrl = field(row, ['per_url','record_url','person_url','url']);
    const first = plain(field(row, ['first','first_name','firstname']));
    const last = plain(field(row, ['last','last_name','lastname']));
    const sisid = plain(field(row, ['per_sisid','sisid','SIS_ID','SISID','student_id']));
    return {
      name: readableName(rawName) || [first, last].filter(Boolean).join(' '),
      email: plain(field(row, ['per_email','email'])),
      phone: plain(field(row, ['per_phone','phone','mobile'])),
      sisid: sisid,
      // maindb returns per_degree_current; there is no app_degree column.
      program: plain(field(row, ['per_degree_current','app_degree','program','program_name'])),
      status: plain(field(row, ['per_status','status'])) || stageLabels[stage],
      teachingSite: teachingSite(row) || payload.filters.site,
      record_url: recordLink(rawUrl || rawName) || (sisid ? window.location.origin + '/manage/database/record?lookup=' + encodeURIComponent(sisid) : '')
    };
  }

  // ---------- load

  async function fetchPeople() {
    const url = new URL(peopleService);
    // The gateway turns these into the right Slate parameters per stage; see
    // its header comment.
    if (payload.filters.term) url.searchParams.set('term', payload.filters.term);
    if (payload.filters.year) url.searchParams.set('year', payload.filters.year);
    if (payload.filters.site) url.searchParams.set('site', payload.filters.site);
    const response = await fetch(url.toString().replace(/\+/g, '%20'), { credentials:'same-origin', cache:'no-store', headers:{ Accept:'application/json' } });
    if (!response.ok) throw new Error('Teaching site query returned ' + response.status);
    return await response.json();
  }

  function build(body) {
    const sites = Array.isArray(body && body.sites) ? body.sites.map(plain).filter(Boolean) : [];
    payload.teachingSites = sites.length ? sites : fallbackTeachingSites.slice();
    if (typeof body.inquiriesAllTime === 'boolean') payload.inquiriesAllTime = body.inquiriesAllTime;

    const studentsBySite = new Map();
    // Seed every known site so one with no students renders as a zero instead
    // of dropping out of the payload.
    payload.teachingSites.forEach(site => studentsBySite.set(site, 0));

    stages.forEach(stage => {
      const rows = body && body.stages && Array.isArray(body.stages[stage]) ? body.stages[stage] : [];
      rows.forEach(row => {
        const record = normalizeRecord(row, stage);
        payload.funnelRecords[stage].push(record);
        payload.funnel[stage] += 1;
        payload.summary[stage] += 1;
        // The overview groups these by title for its active-site list and
        // record total, keeping them in step with the three stats above.
        payload.records.push({ title: record.teachingSite });
        if (stage === 'students' && record.teachingSite) {
          studentsBySite.set(record.teachingSite, (studentsBySite.get(record.teachingSite) || 0) + 1);
        }
      });
    });

    payload.studentsBySite = Array.from(studentsBySite, entry => ({ title: entry[0], count: entry[1] }));

    const failed = Array.isArray(body && body.failedStages) ? body.failedStages : [];
    if (failed.length) {
      const message = 'Slate did not return ' + failed.join(' and ') + ', so these counts may be low.';
      if (payload.filters.site) payload.funnelError = message;
      else payload.summaryError = message;
      failed.forEach(stage => { payload.funnelRecordErrors[stage] = 'Unable to load these records from Slate. Please try again.'; });
    }
    return payload;
  }

  async function loadFunnel() {
    try {
      return build(await fetchPeople());
    } catch (error) {
      console.error('Teaching site query failed.', error);
      const message = 'Unable to load teaching site data from Slate. Please try again.';
      if (payload.filters.site) payload.funnelError = message;
      else payload.summaryError = message;
      stages.forEach(stage => { payload.funnelRecordErrors[stage] = message; });
      payload.teachingSites = fallbackTeachingSites.slice();
      return payload;
    }
  }

  // ---------- frame bridge

  const payloadReady = loadFunnel();
  async function sendData() {
    const resolvedPayload = await payloadReady;
    if (frame.contentWindow) frame.contentWindow.postMessage({ type:'enrollment-dashboard-data', dashboard, payload:resolvedPayload }, frameOrigin);
  }
  function navigate(message) {
    const url = new URL(window.location.href);
    Object.keys(message.set || {}).forEach(key => { const value = String(message.set[key] || '').trim(); if (allowedParams.has(key) && value.length <= 100) url.searchParams.set(key, value); });
    (message.remove || []).forEach(key => { if (removableParams.has(key)) url.searchParams.delete(key); });
    window.location.assign(url.toString().replace(/\+/g, '%20'));
  }
  function openRecord(value) {
    try {
      const url = new URL(String(value || ''), window.location.origin);
      if (url.origin === window.location.origin) window.open(url.href, '_blank', 'noopener');
    } catch (_) {}
  }
  window.addEventListener('message', function (event) {
    if (event.origin !== frameOrigin || event.source !== frame.contentWindow || !event.data || event.data.dashboard !== dashboard) return;
    if (event.data.type === 'enrollment-dashboard-ready') sendData();
    if (event.data.type === 'enrollment-dashboard-resize') frame.style.height = Math.max(600, Math.min(Number(event.data.height) || 600, 10000)) + 'px';
    if (event.data.type === 'enrollment-dashboard-navigate') navigate(event.data);
    if (event.data.type === 'enrollment-dashboard-open-record') openRecord(event.data.url);
  });
  frame.addEventListener('load', sendData);
}());
</script>
